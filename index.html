"type": "h", "text": "Qué es preprocesamiento"}, {"type": "p", "text": "Es una transformación aplicada al dato antes de guardarlo. sysUpTime se expresa en centésimas de segundo; multiplicar por 0.01 lo convierte a segundos. Si la consulta directa muestra 12345 centésimas, el valor convertido es 123.45 segundos. El ejemplo explica la conversión y no es una medición de tu equipo."}, {"type": "p", "text": "En Preprocessing pulsa Add, selecciona Custom multiplier e introduce 0.01. Guarda el ítem. En Latest data recupera nombre y tiempo de cada host. El formato puede convertir la unidad s a una representación temporal legible; compara siempre con la unidad de la consulta directa."}, {"type": "h", "text": "Comprobar la procedencia"}, {"type": "p", "text": "Consulta de nuevo sysUpTime con snmpget al mismo dispositivo y anota las marcas de consulta. El dato puede haber avanzado entre lecturas. Si cambiaste de host o comparaste valores antes y después de reiniciar el agente SNMP, documenta esa condición; no concluyas que Zabbix mide mal solo porque dos números no son idénticos."}, {"type": "verify", "text": "puedes explicar el OID, la unidad recibida, la transformación y la unidad almacenada. Eso demuestra algo más que copiar un campo."}]}, {"id": 37, "title": "SW1 Medir tráfico de una interfaz real", "blocks": [{"type": "p", "text": "Un contador acumulado de octetos no es una tasa. Para obtener bit/s necesitas la diferencia entre lecturas, el intervalo real y multiplicar octetos por ocho. No uses la capacidad nominal de un puerto como si fuera tráfico medido."}, {"type": "h", "text": "Elegir el índice del puerto"}, {"type": "p", "text": "Utiliza la tabla de interfaces obtenida con snmpwalk y anota el índice real del puerto al PC. Los siguientes ejemplos usan índice 2 únicamente como muestra. Sustituye el sufijo y la clave si tu índice es otro."}, {"type": "command", "where": "MON para comprobar OID antes de crear ítems", "text": "snmpget -v2c -c LAB3399813 192.168.57.2 .1.3.6.1.2.1.31.1.1.1.6.2\nsnmpget -v2c -c LAB3399813 192.168.57.2 .1.3.6.1.2.1.31.1.1.1.10.2", "why": "consulta ifHCInOctets e ifHCOutOctets del índice de ejemplo: contadores de 64 bits de entrada y salida. El sufijo 2 debe corresponder al puerto real.", "result": "ambos objetos devuelven contadores. Si no existen, identifica los OID soportados por el modelo y registra la limitación; no fabriques lecturas."}, {"type": "h", "text": "Crear los ítems en SW1-E01"}, {"type": "table", "heads": ["Campo", "Entrada", "Salida"], "rows": [["Name", "LAB puerto entrada", "LAB puerto salida"], ["Type", "SNMP agent", "SNMP agent"], ["Key", "lab.if.in[2]", "lab.if.out[2]"], ["SNMP OID", ".1.3.6.1.2.1.31.1.1.1.6.2", ".1.3.6.1.2.1.31.1.1.1.10.2"], ["Type of information", "Numeric float", "Numeric float"], ["Units", "bps", "bps"], ["Update interval e History", "60s y 7d", "60s y 7d"]]}, {"type": "p", "text": "Para ambos ítems, en Preprocessing agrega primero Change per second y después Custom multiplier con valor 8. El orden importa: primero se convierte incremento a octetos por segundo; después, a bits por segundo. Se requieren lecturas consecutivas para calcular la primera tasa."}, {"type": "verify", "text": "el historial conserva tasas de un puerto identificado. Una tasa cero puede ser válida si el contador no aumentó; un error de consulta no es cero."}]}, {"id": 38, "title": "Agregar respuesta ICMP a los tres equipos", "blocks": [{"type": "command", "where": "MON", "text": "ping -c 4 192.168.56.20\nsudo -u zabbix fping -c 3 192.168.56.20", "why": "ping comprueba respuesta con el usuario de tu terminal. sudo -u zabbix prueba fping con la identidad que usa el servidor Zabbix; -c define cuántas solicitudes se ejecutan en esta comprobación puntual.", "result": "ambas herramientas reciben respuesta de SRV. Si fping muestra un problema de permisos, revisa su instalación y permisos del paquete antes de atribuirlo al destino."}, {"type": "p", "text": "En Items de SRV-E01 crea el ítem de la tabla. Después créalo en R1-E01 y SW1-E01. Cada ítem usa la interfaz de su propio host. Si existe una clave idéntica, revisa y reutiliza su configuración; no crees un duplicado."}, {"type": "table", "heads": ["Campo", "Valor"], "rows": [["Name", "LAB ICMP"], ["Type", "Simple check"], ["Key", "icmpping"], ["Type of information", "Numeric unsigned"], ["Host interface", "Interfaz con la IP del equipo que estás configurando."], ["Update interval", "60s"], ["History", "7d"], ["Units", "Vacío, porque representa un estado."], ["Preprocessing", "Vacío para conservar también valores iguales."], ["Enabled", "Habilitado"]]}, {"type": "p", "text": "Simple check realiza la consulta desde el servidor o proxy, sin agente instalado en el destino. 1 representa respuesta ICMP y 0 representa ausencia de respuesta en una comprobación ejecutada. SD representará un registro ausente en tu hoja; no transformes ausencia de datos en cero."}, {"type": "p", "text": "Abre Latest data → LAB ICMP → History de cada host. Comprueba registros repetidos con marcas de consulta distintas. Una regla de descarte de valores iguales reduciría el historial y no sirve para la comprobación de cobertura de este taller."}, {"type": "verify", "text": "los tres hosts guardan ICMP y puedes distinguir 0, 1 y ausencia de muestra. ICMP no demuestra por sí solo que una aplicación web o de correo funcione."}]}, {"id": 39, "title": "Crear una cuenta que solo consulte", "blocks": [{"type": "p", "text": "La cuenta administradora cambia configuraciones. Una cuenta de consulta debe ver datos sin modificar los hosts. Para lograrlo se combinan rol, pertenencia a un grupo de usuarios y permiso sobre un grupo de hosts."}, {"type": "h", "text": "Configurar y probar el acceso"}, {"type": "p", "text": "1. Con la cuenta administradora abre Users → User groups → Create user group. Name Lectura-E01. En Host permissions selecciona el grupo LAB3399813-E01 y permiso Read. Guarda."}, {"type": "p", "text": "2. En Users → Users → Create user escribe Username consulta-e01, define su contraseña privada, asigna Lectura-E01 y el rol User. Guarda. No le asignes el rol Super admin."}, {"type": "p", "text": "3. Abre una ventana privada del navegador de Windows físico y entra al panel de MON con consulta-e01. En Monitoring → Latest data verifica SRV-E01, R1-E01 y SW1-E01. La cuenta debe poder recuperar lecturas y no modificar hosts."}, {"type": "p", "text": "4. Si falta un equipo, revisa que ese host pertenezca a LAB3399813-E01. Si faltan todos, revisa el permiso del grupo Lectura-E01 y la pertenencia del usuario a ese grupo. El nombre parecido de un grupo no otorga permisos por sí solo."}, {"type": "table", "heads": ["Objeto", "Función", "Ejemplo"], "rows": [["Host group", "Reúne equipos monitoreados.", "LAB3399813-E01"], ["User group", "Reúne usuarios con permisos.", "Lectura-E01"], ["Role", "Define operaciones permitidas en la interfaz.", "User para consulta."], ["Read", "Permite consultar datos del grupo autorizado.", "Historial de SRV y equipos de red."]]}, {"type": "verify", "text": "la cuenta de consulta ve los equipos y la administradora permanece disponible en otra sesión. Registra la prueba sin incluir contraseñas."}]}, {"id": 40, "title": "Construir y compartir un tablero comprensible", "blocks": [{"type": "p", "text": "Un dashboard organiza datos de distintos hosts en widgets. Cada widget debe nombrar equipo, métrica y unidad para evitar que una gráfica de MON se interprete como una medición de SRV."}, {"type": "h", "text": "Crear cada widget desde la cuenta administradora"}, {"type": "p", "text": "1. Abre Dashboards → Create dashboard. Escribe LAB3399813-E01. Entra a Edit dashboard y selecciona Add widget. Para un dato puntual elige Item value; para una serie numérica elige Graph. Define un título descriptivo, selecciona host e ítem y confirma Add."}, {"type": "table", "heads": ["Título", "Tipo", "Origen y dato"], "rows": [["SRV respuesta ICMP", "Item value", "SRV-E01 → LAB ICMP."], ["SRV CPU utilizada", "Graph", "SRV-E01 → CPU utilization en %."], ["SRV memoria disponible", "Item value o Graph", "Memoria disponible en %; conserva esa magnitud en el título."], ["SRV espacio usado de raíz", "Item value o Graph", "SRV-E01 → porcentaje usado de /."], ["SW1 tráfico del puerto identificado", "Graph", "SW1-E01 → LAB puerto entrada y LAB puerto salida."], ["Identidad de R1", "Item value", "R1-E01 → LAB SNMP nombre."], ["Identidad de SW1", "Item value", "SW1-E01 → LAB SNMP nombre."]]}, {"type": "p", "text": "2. En Graph del puerto añade dos conjuntos o series: entrada y salida del mismo índice. Si usas Graph classic, elige una gráfica ya configurada que incluya las dos. No mezcles datos de puertos diferentes ni un contador acumulado con una tasa."}, {"type": "p", "text": "3. Pulsa Save changes del tablero. En Sharing añade Lectura-E01 con permiso Read y guarda. Abre el mismo tablero con consulta-e01. Tener permiso de lectura del host no comparte automáticamente un tablero privado."}, {"type": "p", "text": "4. Ajusta el selector temporal a un periodo que incluya datos reales. Comprueba las marcas del último dato de los ítems. La pantalla puede refrescarse aunque no llegue ninguna lectura nueva."}, {"type": "verify", "text": "el tablero muestra recursos de SRV, tráfico de SW1 e identidades físicas correctas, y puede abrirlo el usuario de consulta."}]}, {"id": 41, "title": "Contrastar una lectura con el servidor real", "blocks": [{"type": "p", "text": "Contrastar significa comprobar una métrica por otra consulta al mismo equipo. Deben coincidir magnitud, objeto y unidad. No compares porcentaje usado con porcentaje libre ni la raíz de SRV con el disco de MON."}, {"type": "h", "text": "Comprobar el sistema de archivos raíz de SRV"}, {"type": "p", "text": "En Latest data de SRV-E01 selecciona el porcentaje de espacio usado de /. Anota valor y marca temporal. Después abre la consola de SRV y ejecuta el bloque."}, {"type": "command", "where": "SRV", "text": "date --iso-8601=seconds\ndf -P /", "why": "date identifica el instante y zona de la consulta. df informa capacidad y uso de la raíz; -P utiliza formato POSIX y / selecciona el sistema de archivos donde está la raíz. La columna Use% es el porcentaje usado.", "result": "tienes una lectura directa del mismo sistema de archivos para comparar con Zabbix."}, {"type": "table", "heads": ["Origen", "Marca temporal", "Valor y unidad"], "rows": [["Panel SRV  / usado", "_______________", "_______________"], ["Consola SRV  df Use%", "_______________", "_______________"], ["Diferencia", "Entre ambas lecturas", "____ puntos porcentuales"]]}, {"type": "p", "text": "Una diferencia puede deberse a redondeo o a que el uso cambió entre consultas. Si la diferencia es grande, revisa host, partición y magnitud antes de atribuir un error a la plataforma. Conserva ambas salidas con una explicación, no solo un juicio de coincide o no coincide."}, {"type": "h", "text": "Comprender memoria y tráfico"}, {"type": "command", "where": "SRV", "text": "free -h\nip -s link show enp0s8", "why": "free distingue memoria total, libre y disponible. ip -s muestra estadísticas de una interfaz, incluida cantidad acumulada de bytes; sustituye enp0s8 si no es tu interfaz del laboratorio.", "result": "reconoces que memoria libre no equivale a disponible y que un contador de bytes no se compara directamente con una tasa en bit/s."}, {"type": "verify", "text": "cada integrante puede explicar al menos una lectura y cómo llegó del equipo al panel."}]}, {"id": 42, "title": "Conservar la línea base y recuperar el historial", "blocks": [{"type": "p", "text": "La línea base describe el comportamiento normal observado bajo condiciones conocidas. No es un número universal ni una garantía de funcionamiento permanente. Completa configuraciones y descargas antes de conservarla, para que esas tareas no cambien las condiciones de la observación."}, {"type": "h", "text": "Preparar la recolección"}, {"type": "p", "text": "Comprueba LAB ICMP de SRV, R1 y SW1: intervalo 60s, historial 7d y preprocesamiento sin descarte de valores iguales. Estos son parámetros técnicos del registro, no una programación de la actividad. Conserva 30 posiciones de consulta previstas por host y registra las muestras reales recibidas."}, {"type": "p", "text": "Anota el inicio y el final reales del rango conservado y su zona. No pulses Execute now, no reinicies equipos ni cambies intervalos dentro de ese rango. Si ocurre un cambio, regístralo como condición y conserva los datos en lugar de borrarlos."}, {"type": "h", "text": "Recuperar valores del mismo rango"}, {"type": "p", "text": "En Monitoring → Latest data abre LAB ICMP → History de cada host. Elige valores o lista si aparece una gráfica y establece un rango absoluto con fecha y marcas de inicio y fin. Conserva la tabla de valores mediante la opción disponible o copiando sus filas a un archivo CSV. Una imagen de la curva no sustituye los registros."}, {"type": "p", "text": "Completa una hoja de 30 posiciones por host usando las marcas reales. Cuando falte una posición escribe SD; no inventes un registro. Conserva duplicados en el historial original y explica cómo los trataste para contar una muestra por posición. La planificación inicial puede desplazar una muestra: registra la diferencia."}, {"type": "h", "text": "Interpretar la cobertura"}, {"type": "p", "text": "Cobertura de recolección = posiciones con dato / 30 × 100. Es una medida de cuánto registro recuperaste. No la llames disponibilidad empresarial. Dentro de las posiciones con dato, 0 es una comprobación sin respuesta y 1 una comprobación con respuesta. SD significa que no hay registro para esa posición."}, {"type": "p", "text": "Conserva también las gráficas de CPU, memoria, almacenamiento y tráfico de SW1 del mismo rango. Describe qué tareas estaban activas, los equipos conectados y las limitaciones. Luego cierra la vista y recupera de nuevo ese rango para comprobar que el historial realmente quedó guardado."}, {"type": "verify", "text": "puedes explicar de dónde salió cada dato, cuánto historial recuperaste y qué límites tiene tu conclusión."}]}, {"id": 43, "title": "Hoja de registro por host", "blocks": [{"type": "p", "text": "Equipo de trabajo ______  Host ______  Ítem LAB ICMP\nFecha ______  Zona ______  Inicio real ______  Final real ______"}, {"type": "p", "text": "R respuesta, NR no respondió, SD sin dato. Escribe marcas reales; adjunta el historial original. Duplica esta hoja para SRV, R1 y SW1."}, {"type": "table", "heads": ["Posición", "Marca de consulta", "Valor 0 o 1 o SD", "Resultado"], "rows": [["1", "________________", "________________", "________"], ["2", "________________", "________________", "________"], ["3", "________________", "________________", "________"], ["4", "________________", "________________", "________"], ["5", "________________", "________________", "________"], ["6", "________________", "________________", "________"], ["7", "________________", "________________", "________"], ["8", "________________", "________________", "________"], ["9", "________________", "________________", "________"], ["10", "________________", "________________", "________"], ["11", "________________", "________________", "________"], ["12", "________________", "________________", "________"], ["13", "________________", "________________", "________"], ["14", "________________", "________________", "________"], ["15", "________________", "________________", "________"], ["16", "________________", "________________", "________"], ["17", "________________", "________________", "________"], ["18", "________________", "________________", "________"], ["19", "________________", "________________", "________"], ["20", "________________", "________________", "________"], ["21", "________________", "________________", "________"], ["22", "________________", "________________", "________"], ["23", "________________", "________________", "________"], ["24", "________________", "________________", "________"], ["25", "________________", "________________", "________"], ["26", "________________", "________________", "________"], ["27", "________________", "________________", "________"], ["28", "________________", "________________", "________"], ["29", "________________", "________________", "________"], ["30", "________________", "________________", "________"]]}, {"type": "p", "text": "Con dato ____ / 30  |  Cobertura ____ %  |  Ceros ____  |  SD ____\nDuplicados y tratamiento ______________________________________________\nCondiciones observadas ______________________________________________"}]}, {"id": 44, "title": "Entregar la ficha y conservar el montaje", "blocks": [{"type": "p", "text": "Presenta un solo documento por equipo de trabajo con información que otra persona pueda utilizar para comprender y repetir el laboratorio. Las evidencias deben proceder de tu montaje y explicar qué demuestran."}, {"type": "table", "heads": ["Apartado", "Qué debes incluir"], "rows": [["Identificación", "Integrantes, ficha, equipo y roles realizados."], ["Esquema e inventario", "Windows físico, MON, SRV, R1 y SW1; conexiones, IP, modelo, versión y puertos."], ["Instalación de MON", "ISO, recursos, Ubuntu, paquetes, PostgreSQL, servidor y panel comprobados."], ["Instalación de SRV", "VM, Ubuntu, agente y consulta desde MON."], ["Gestión de acceso", "Clave inicial del panel cambiada y prueba de usuario de lectura, sin revelar claves."], ["Equipos físicos", "Consulta directa e ítems SNMP propios de R1 y SW1."], ["Métricas", "Tablero con unidades y contraste de una lectura."], ["Línea base", "Historial, hojas por host, cobertura, faltantes y gráficas del mismo rango."], ["Justificación y límites", "Por qué se eligió Zabbix, comparación con dos alternativas y pendientes reales."]]}, {"type": "h", "text": "Justificar la herramienta"}, {"type": "p", "text": "Consulta los sitios oficiales de Zabbix, LibreNMS y PRTG. Zabbix permite combinar agentes y consultas de red; LibreNMS enfatiza descubrimiento y monitoreo de dispositivos; PRTG organiza monitoreo mediante sensores. Explica por qué la combinación que utilizaste resuelve este laboratorio y qué estudiarías antes de usar otra alternativa. No necesitas instalar las tres."}, {"type": "h", "text": "Guardar el estado final"}, {"type": "command", "where": "primero SRV y después MON", "text": "sudo poweroff", "why": "apaga Ubuntu de manera ordenada para no interrumpir escrituras ni la base de datos.", "result": "cada VM queda apagada. En VirtualBox puedes tomar una instantánea llamada A1_operativo para recuperar este estado."}, {"type": "p", "text": "Conserva también los archivos completos de las VMs o una exportación si necesitas moverlas; una instantánea no es por sí sola un respaldo independiente. Restaura el Ethernet de Windows a su configuración previa cuando termines. En los equipos físicos conserva o revierte únicamente los cambios de esta práctica según las condiciones de uso acordadas, sin borrar configuraciones ajenas."}]}, {"id": 45, "title": "Resolver problemas del sistema y del panel", "blocks": [{"type": "p", "text": "Anota síntoma, prueba, mensaje y cambio. Corrige una causa por vez y repite la misma comprobación. Reinstalar todo suele ocultar qué falló y puede destruir resultados que ya eran válidos."}, {"type": "table", "heads": ["Síntoma", "Primera comprobación", "Qué corregir"], "rows": [["VM no arranca en 64 bits", "Virtualización y arquitectura x64.", "ISO y soporte de hardware."], ["Vuelve al instalador", "ISO todavía montada.", "Retirar ISO y arrancar desde el VDI."], ["No hay descargas", "ip route y resolución de nombres.", "Adaptador NAT, DHCP y acceso del Windows físico."], ["Error de YAML", "Archivo y sangría.", "Espacios, nombres reales y una sola definición de interfaz."], ["Base no acepta clave", "Prueba psql por TCP.", "CLAVE_BD y usuario correctos."], ["Zabbix no está activo", "Registro del servidor.", "Conexión de base o importación."], ["Panel no abre", "curl local y conexión desde Windows.", "Apache, ruta /zabbix/ o reglas del puerto 80."]]}, {"type": "command", "where": "MON", "text": "systemctl status zabbix-server --no-pager\nsudo tail -n 30 /var/log/zabbix/zabbix_server.log\nsudo apache2ctl configtest\nsudo tail -n 30 /var/log/apache2/error.log", "why": "status muestra estado y fallos recientes; --no-pager evita un visor interactivo. tail -n 30 lee las últimas 30 líneas del registro. apache2ctl configtest valida la sintaxis de Apache sin reinstalarlo.", "result": "tienes un mensaje específico para relacionar con base, proceso o panel. Oculta credenciales si guardas evidencias."}, {"type": "p", "text": "Si apt indica un bloqueo, otra tarea de paquetes puede estar trabajando: espera su finalización y revisa su estado, sin borrar el archivo de bloqueo. Si SQL informa tablas existentes, no repitas la importación sin comprobar si ya está completa. No elimines bases con lecturas como ensayo de solución."}]}, {"id": 46, "title": "Resolver problemas de recolección", "blocks": [{"type": "table", "heads": ["Síntoma", "Diagnóstico que debes hacer"], "rows": [["Ping responde y agente no", "Servicio de SRV, Server con IP de MON, puerto 10050 y UFW."], ["Agente responde y panel no registra", "IP e interfaz del host, plantilla pasiva, habilitación y error del ítem."], ["SNMP Timeout", "Ruta por el puente, origen permitido, modelo, versión, comunidad y firewall."], ["Objeto SNMP no existe", "OID soportado e índice real; no significa necesariamente caída del equipo."], ["SVI Cisco down", "VLAN y al menos un puerto activo en ella."], ["Tráfico no tiene tasa", "Dos lecturas consecutivas y orden de preprocesamiento."], ["Usuario sin datos", "Grupo de hosts, permiso Read, rol y compartición de tablero."], ["Pocas muestras", "Rango, intervalo, errores y descarte de valores repetidos."]]}, {"type": "command", "where": "SRV", "text": "systemctl is-active zabbix-agent2\nsudo ss -lntp | grep 10050\nsudo journalctl -u zabbix-agent2 -n 30 --no-pager", "why": "is-active comprueba el proceso; ss verifica escucha TCP; journalctl consulta el registro del servicio indicado por -u y limita a 30 entradas con -n. Estas consultas no cambian la configuración.", "result": "puedes distinguir servicio detenido, falta de escucha y rechazo de conexiones."}, {"type": "h", "text": "Registro de una corrección propia"}, {"type": "p", "text": "Equipo y marca de consulta __________________________________________\nSíntoma ___________________________________________________________\nPrueba y mensaje ___________________________________________________\nHipótesis __________________________________________________________\nCambio ____________________________________________________________\nResultado al repetir la misma prueba __________________________________"}, {"type": "verify", "text": "la corrección se apoya en un mensaje y una prueba. Si una limitación del modelo impide una métrica, la ficha lo explica y no la presenta como lograda."}]}, {"id": 47, "title": "Fuentes oficiales de consulta", "blocks": [{"type": "source", "title": "Ubuntu Server y descarga de la ISO", "url": "https://releases.ubuntu.com/24.04/"}, {"type": "source", "title": "Instalación de Ubuntu Server", "url": "https://ubuntu.com/server/docs/tutorial/basic-installation/"}, {"type": "source", "title": "Configuración de red en Ubuntu", "url": "https://ubuntu.com/server/docs/explanation/networking/configuring-networks/"}, {"type": "source", "title": "Redes en VirtualBox", "url": "https://docs.oracle.com/en/virtualization/virtualbox/7.2/user/networkingdetails.html"}, {"type": "source", "title": "Selector oficial de paquetes Zabbix", "url": "https://www.zabbix.com/download"}, {"type": "source", "title": "Repositorio Zabbix para Ubuntu", "url": "https://repo.zabbix.com/zabbix/7.0/ubuntu/pool/main/z/zabbix-release/"}, {"type": "source", "title": "Creación de la base de datos Zabbix", "url": "https://www.zabbix.com/documentation/7.0/en const groups=[{name:'Comienza aquí',start:0,end:4,label:'Preparar el entorno',text:'Reconoce los equipos. Prepara el Windows físico, VirtualBox y la imagen de Ubuntu.',tag:'Windows físico'},{name:'01 · Primer servidor',start:5,end:17,label:'Construir MON completo',text:'Instala Ubuntu, Zabbix, PostgreSQL y el panel. Comprueba MON antes de crear SRV.',tag:'MON · Ubuntu Server'},{name:'02 · Segundo servidor',start:18,end:25,label:'Construir SRV completo',text:'Crea otra VM desde cero. Instala Ubuntu y el agente, y consulta sus recursos desde MON.',tag:'SRV · Ubuntu Server'},{name:'03 · Equipos físicos',start:26,end:34,label:'Conectar la red física',text:'Identifica tu Cisco o MikroTik. Configura la gestión y prueba SNMP desde MON.',tag:'Router y switch'},{name:'04 · Datos y evidencias',start:35,end:44,label:'Ver, interpretar y comprobar',text:'Crea métricas, arma el tablero, contrasta lecturas y conserva el historial.',tag:'Panel de Zabbix'},{name:'Consulta y diagnóstico',start:45,end:48,label:'Resolver y profundizar',text:'Busca el síntoma, comprueba una causa por vez y consulta las fuentes oficiales.',tag:'Apoyo del montaje'}];
const glossary=[['Máquina virtual (VM)','Computador creado por software con su propio sistema, memoria, disco y tarjetas de red. MON y SRV son VMs independientes.'],['Hipervisor','Programa que administra las máquinas virtuales. En este montaje es VirtualBox y se ejecuta en el Windows físico.'],['ISO y VDI','La ISO es el medio de instalación. El VDI es el disco virtual donde queda instalado Ubuntu. Retirar la ISO no elimina el sistema instalado.'],['MON y SRV','MON contiene la plataforma que pregunta y guarda datos. SRV es el equipo observado que responde mediante su agente.'],['Zabbix server','Proceso que planifica consultas, procesa respuestas y se conecta a la base de datos. No es lo mismo que la página web.'],['PostgreSQL','Motor de base de datos de MON. Conserva configuración e historial. Su usuario zabbix es distinto de la cuenta Admin del panel.'],['Apache y PHP','Apache atiende solicitudes web; PHP genera la interfaz. El navegador muestra el resultado desde el Windows físico.'],['Agente pasivo','MON inicia una conexión TCP al puerto 10050 de SRV. El parámetro Server del agente autoriza la dirección de MON.'],['NAT','Modo de VirtualBox utilizado para descargar paquetes mediante la conexión del computador. No uses su IP privada para conectar MON con SRV.'],['Solo anfitrión','Red local de VirtualBox que une Windows, MON y SRV dentro de un mismo PC. Aquí usa 192.168.56.0/24.'],['Puente','Adaptador que permite a MON participar en el Ethernet físico de router y switch. Aquí usa 192.168.57.0/24.'],['Dirección IP y /24','La IP identifica una interfaz. /24 indica una máscara de 255.255.255.0. Los destinos de la misma subred pueden comunicarse sin un gateway adicional.'],['DHCP y DNS','DHCP entrega parámetros de red automáticamente. DNS resuelve nombres. Obtener una IP no demuestra que DNS funcione.'],['Netplan y YAML','Netplan aplica la red persistente de Ubuntu desde archivos YAML. La sangría define la estructura: usa espacios y los nombres de interfaz reales.'],['SNMP','Protocolo de gestión para consultar objetos del router o switch. En este montaje MON consulta UDP 161 con permisos de lectura y origen limitado.'],['OID e índice','El OID identifica un objeto SNMP. Un escalar suele terminar en .0; una interfaz utiliza su índice real. El índice no se deduce del número pintado en el puerto.'],['Comunidad SNMP','Texto de autorización para SNMP v2c. No viaja cifrado. Usa lectura, restringe el origen y trabaja en la red aislada descrita en la guía.'],['ICMP y ping','Permiten comprobar respuesta de un destino. Una respuesta ICMP no demuestra que una aplicación o un agente esté funcionando.'],['Host, ítem y plantilla','Host: equipo registrado. Ítem: dato que se consulta. Plantilla: conjunto reutilizable de definiciones. La IP efectiva del host determina a quién se consulta.'],['Contador y tasa','Un contador acumula octetos. La tasa mide cuánto cambia por segundo. Para bit/s: diferencia de octetos ÷ intervalo real × 8.'],['VLAN y SVI','Una VLAN separa un dominio de capa 2. Una SVI es una interfaz lógica que permite gestionar el switch mediante IP. Su estado depende también de puertos activos.'],['Línea base','Conjunto de observaciones bajo condiciones documentadas. Describe el comportamiento observado; no garantiza que siempre se repetirá.'],['Cero y sin dato','En ICMP, 0 es una comprobación sin respuesta; 1 indica respuesta. SD significa que falta un registro. No conviertas automáticamente SD en 0.'],['Cobertura de recolección','Posiciones con dato ÷ posiciones previstas × 100. Cuenta tanto valores 0 como 1. No es una medición de disponibilidad empresarial.']];
const quizzes={1:{q:'Cierras el navegador de Windows. MON y SRV siguen encendidos. ¿Qué ocurre?',o:['La recolección se detiene porque cerraste el panel.','MON puede seguir recolectando; el navegador solo muestra la interfaz.','PostgreSQL se desinstala.'],a:1,why:'El servidor Zabbix y la base funcionan dentro de MON, independientemente de que el navegador esté abierto.'},4:{q:'¿Qué adaptador se utiliza para que MON consulte al agente de SRV?',o:['NAT individual de cada VM.','Puente al Wi-Fi.','Solo anfitrión, usando .56.10 y .56.20.'],a:2,why:'Solo anfitrión conecta las dos VMs y Windows dentro del mismo PC. NAT queda para las descargas.'},17:{q:'MON ya muestra el panel. ¿Qué debes hacer antes de comenzar SRV?',o:['Comprobar los servicios, cambiar la clave inicial y probar el agente local de MON.','Borrar el disco VDI de MON.','Instalar Windows en otra VM.'],a:0,why:'El panel visible no basta: MON debe quedar terminado y comprobado antes de crear el segundo servidor.'},24:{q:'El agente de SRV tiene Server=192.168.56.10. ¿Qué significa?',o:['Que SRV ahora tiene la IP .56.10.','Que autoriza a MON para consultar al agente.','Que se conecta al navegador de Windows.'],a:1,why:'Server autoriza el origen de consultas pasivas. La dirección de SRV se configura en su red y en la interfaz del host registrado.'},34:{q:'SNMP devuelve un objeto no existente. ¿Qué concluyes?',o:['Que el equipo está necesariamente apagado.','Que debes borrar su configuración.','Que debes revisar OID, índice y soporte del modelo.'],a:2,why:'Un objeto no soportado y un timeout son resultados distintos. La respuesta no demuestra una caída del dispositivo.'},37:{q:'¿Es correcto poner la unidad bps a un contador y asumir que ya tienes tráfico por segundo?',o:['Sí, la etiqueta transforma el número.','No: primero cambio por segundo y después multiplicador 8.','Sí, si el contador tiene 64 bits.'],a:1,why:'La unidad solo rotula. La tasa necesita dos lecturas, el intervalo real y la conversión de octetos a bits.'},42:{q:'Hay 27 valores 1, dos valores 0 y una posición SD entre 30 posiciones. ¿Cuál es la cobertura?',o:['90 %, porque solo cuentan las respuestas 1.','96,67 %, porque existen 29 posiciones con dato.','100 %, porque SD es lo mismo que 0.'],a:1,why:'Los valores 0 también son registros. Cobertura = 29/30 × 100. La ausencia de un registro se conserva como SD.'}};
const illustrations={1:['arquitectura.svg','La consulta sale de MON; el agente y los dispositivos responden. El panel muestra lo que la plataforma conserva.'],3:['instalacion.svg','La ISO instala Ubuntu dentro del disco VDI de cada máquina virtual.'],4:['tres-redes.svg','Cada adaptador tiene un propósito. Agregarás el puente cuando llegues a los equipos físicos.'],5:['dos-servidores.svg','En esta etapa solo creas MON. SRV comienza después de comprobar completamente el primer servidor.'],11:['arquitectura.svg','Los componentes se instalan en MON; cada uno cumple una función diferente.'],18:['dos-servidores.svg','Ahora creas SRV desde cero. Esta segunda VM tiene su propio disco, usuario y sistema operativo.'],26:['topologia.svg','Esquema de referencia. Si compartes dispositivos físicos, usa direcciones únicas según la guía.'],27:['tres-redes.svg','La tarjeta puente de MON se añade a las dos tarjetas existentes.'],29:['topologia.svg','La consola permite configurar SW1; el Ethernet transporta sus consultas de gestión.']};

function glossaryPage(){view.append(pageHead('DICCIONARIO DEL LABORATORIO','Comprender para poder explicar','Definiciones ligadas a lo que vas a instalar y comprobar. Usa la búsqueda de la izquierda para encontrar también los procedimientos.'));const grid=el('div','glossary');glossary.forEach(([title,text])=>{const a=el('article');a.append(el('h2','',title),el('p','',text));grid.append(a);});view.append(grid,footer());}
function simulator(){view.append(pageHead('EXPERIMENTO DIDÁCTICO','Un contador no es una tasa','Datos simulados para comprender la conversión. El gráfico no se conecta a tus equipos ni representa una medición real.'));const d=el('section','sim');d.innerHTML='<h2>¿Cuántos bits por segundo pasaron?</h2><p>Lectura inicial: <strong>1.000.000 octetos</strong>. Intervalo entre lecturas: <strong>60 segundos</strong> (parámetro técnico del ejemplo).</p><label for="counter">Segunda lectura: <output id="counter-value"></output> octetos</label><input id="counter" type="range" min="1000000" max="2200000" step="10000" value="1120000"><div id="sim-chart"></div><p id="sim-formula"></p><div class="note"><strong>En Zabbix, respeta este orden</strong>1. Change per second: convierte el incremento en octetos/s.<br>2. Custom multiplier = 8: convierte octetos/s en bit/s.<br>3. Units = bps: rotula la unidad; no transforma el número.</div><p>La primera muestra no basta para calcular una tasa. Un reinicio o discontinuidad del contador requiere revisar los registros antes de interpretar el cambio.</p>';view.append(d);const slider=d.querySelector('#counter');function update(){const n=Number(slider.value),diff=n-1000000,rate=diff/60*8;d.querySelector('#counter-value').textContent=n.toLocaleString('es-CO');d.querySelector('#sim-formula').textContent=`(${n.toLocaleString('es-CO')} − 1.000.000) ÷ 60 × 8 = ${rate.toLocaleString('es-CO',{maximumFractionDigits:2})} bit/s`;
 const y1=220-(1000000/2200000)*170,y2=220-(n/2200000)*170;d.querySelector('#sim-chart').innerHTML=`<svg viewBox="0 0 700 280" role="img" aria-label="El contador aumenta de un millón a ${n} octetos; la tasa resultante es ${Math.round(rate)} bits por segundo"><path d="M80 30V225H660" fill="none" stroke="#a9a2bc"/><text x="85" y="25" fill="#615f68" font-family="Arial" font-size="12">CONTADOR ACUMULADO · OCTETOS</text><path d="M170 ${y1}L550 ${y2}" fill="none" stroke="#2446eb" stroke-width="4"/><circle cx="170" cy="${y1}" r="7" fill="#2446eb"/><circle cx="550" cy="${y2}" r="7" fill="#2446eb"/><text x="120" y="250" fill="#615f68" font-family="Arial" font-size="13">Primera lectura</text><text x="495" y="250" fill="#615f68" font-family="Arial" font-size="13">Segunda lectura</text><text x="390" y="68" fill="#2446eb" font-family="Arial" font-size="22" font-weight="bold">${(rate/1000).toLocaleString('es-CO',{maximumFractionDigits:2})} kbit/s</text><text x="390" y="90" fill="#615f68" font-family="Arial" font-size="12">tasa media entre las dos lecturas</text></svg>`;}slider.addEventListener('input',update);update();const a=el('a','button','Volver al procedimiento de tráfico →');a.href='#paso-37';view.append(a,footer());}
function search(q){view.replaceChildren();view.append(pageHead('BUSCAR EN LA GUÍA',`Resultados para «${q}»`,'La búsqueda revisa conceptos, comandos, explicaciones y tablas de todas las etapas.'));const query=normalize(q.trim());if(!query){view.append(el('p','empty','Escribe un concepto o comando en la búsqueda.'));return;}const matches=lessons.map(s=>({s,text:s.blocks.map(b=>[b.text,b.where,b.why,b.result,b.title,b.heads?.join(' '),b.rows?.flat().join(' ')].filter(Boolean).join(' ')).join(' ')})).filter(({s,text})=>normalize(s.title+' '+text).includes(query));view.append(el('p','',`${matches.length} secciones encontradas`));matches.forEach(({s,text})=>{const a=el('a','search-result');a.href=`#paso-${s.id}`;const i=normalize(text).indexOf(query),start=Math.max(0,i-60);a.append(el('strong','',`${String(s.id).padStart(2,'0')} · ${s.title}`),el('p','',(start?'…':'')+text.slice(start,start+230)+'…'));view.append(a);});if(!matches.length)view.append(el('p','empty','Prueba con otra palabra: agente, netplan, PostgreSQL, SNMP o Windows.'));}
function route(){closeMenu();view.replaceChildren();const hash=location.hash.slice(1)||'inicio';let current=hash;if(/^paso-\d+$/.test(hash)){const id=Number(hash.slice(5));if(id>=0&&id<lessons.length){current=id;view.append(lesson(id));state.last=id;save();document.title=`${id} · ${lessons[id].title} | Laboratorio Zabbix`;}else{home();current='inicio';}}else if(hash==='mapa'){mapPage();document.title='Explorar el montaje | Laboratorio Zabbix';}else if(hash==='glosario'){glossaryPage();document.title='Conceptos | Laboratorio Zabbix';}else if(hash==='simulador'){simulator();document.title='Contador y tasa | Laboratorio Zabbix';}else if(hash==='imprimir'){view.append(pageHead('GUÍA COMPLETA','Montaje de monitoreo con Zabbix','Todas las secciones en orden. Utiliza Imprimir del navegador para guardar como PDF.'));const b=el('button','button','Imprimir ahora');b.addEventListener('click',()=>window.print());view.append(b);lessons.forEach(s=>view.append(lesson(s.id,true)));}else if(hash.startsWith('buscar=')){let q='';try{q=decodeURIComponent(hash.slice(7));}catch{}document.querySelector('#search').value=q;search(q);document.title='Buscar | Laboratorio Zabbix';}else{home();current='inicio';document.title='Laboratorio Zabbix · Aprender haciendo';}renderNav(current);window.scrollTo({top:0,behavior:'instant'});}
document.querySelector('#menu').addEventListener('click',()=>{const open=document.body.classList.toggle('menu-open');document.querySelector('#menu').setAttribute('aria-expanded',String(open));syncMenu();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();});
document.querySelector('main').addEventListener('click',closeMenu);
document.querySelector('#search-form').addEventListener('submit',e=>{e.preventDefault();const q=document.querySelector('#search').value.trim();location.hash=q?'buscar='+encodeURIComponent(q):'inicio';});
document.querySelector('.skip').addEventListener('click',e=>{e.preventDefault();document.querySelector('main').focus();});
window.addEventListener('resize',syncMenu);
document.querySelector('#print').addEventListener('click',()=>{location.hash='imprimir';});
document.querySelector('#reset').addEventListener('click',()=>{if(window.confirm('¿Quieres borrar las etapas marcadas en este navegador? Tus archivos del laboratorio no se modifican.')){state={done:[],last:0};save();route();toast('Avance restablecido.');}});
window.addEventListener('hashchange',route);route();
</script></body></html>
