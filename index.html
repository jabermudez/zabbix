<script>window.LESSONS = [{"id": 0, "title": "Tu laboratorio empieza aquí", "blocks": [{"type": "p", "text": "Actividad 1 del punto 3.3  Preparar y poner en funcionamiento el entorno de monitoreo"}, {"type": "p", "text": "Vas a construir una plataforma que observa un servidor Ubuntu y equipos físicos de red. Empezarás con máquinas virtuales vacías y comprobarás cada resultado antes de avanzar. El producto final es un laboratorio operativo y una ficha técnica con tus propias evidencias."}, {"type": "h", "text": "Dónde está Windows y qué debes instalar"}, {"type": "p", "text": "Windows es el sistema que YA tiene tu computador físico. Allí abrirás VirtualBox, el navegador, PowerShell, PuTTY y WinBox. No vas a instalar Windows, no vas a crear una VM Windows y no vas a formatear el computador físico. Si tu PC usa Windows 10 u 11, las operaciones descritas se realizan en ese Windows existente."}, {"type": "table", "heads": ["Entorno", "Sistema operativo", "Función"], "rows": [["Computador físico", "Windows existente", "Ejecuta VirtualBox y las herramientas de acceso."], ["Primera VM  MON-E01", "Ubuntu Server 24.04 LTS amd64", "Contiene Zabbix, su base de datos PostgreSQL y el panel web."], ["Segunda VM  SRV-E01", "Ubuntu Server 24.04 LTS amd64", "Es el servidor observado; contiene el agente de Zabbix."], ["R1 y SW1 físicos", "RouterOS o sistema Cisco compatible", "Proporcionan identificación y métricas de red mediante SNMP."]]}, {"type": "h", "text": "Orden obligatorio del montaje"}, {"type": "p", "text": "Primero prepara Windows y VirtualBox. Después termina toda la instalación de MON, hasta abrir Zabbix y comprobar sus servicios. Solo entonces crea SRV y completa toda su instalación. A continuación conecta los equipos físicos, configura la recolección, construye el tablero y conserva los resultados. No instales simultáneamente los dos servidores."}, {"type": "p", "text": "Los nombres MON y SRV representan funciones diferentes. MON pregunta y guarda los datos. SRV responde con sus recursos. R1 es el router y SW1 el switch. El nombre que pongas al equipo no cambia su función: tendrás que instalar y configurar el software correspondiente."}]}, {"id": 1, "title": "Entender qué vas a construir", "blocks": [{"type": "p", "text": "Una máquina virtual es un computador creado por software. Tiene memoria, procesadores, disco y tarjetas de red virtuales. El hipervisor VirtualBox administra esos recursos usando el computador físico. Cada VM tiene su propio Ubuntu y su propia sesión; un comando ejecutado en MON no se ejecuta automáticamente en SRV."}, {"type": "h", "text": "Qué hace Zabbix"}, {"type": "p", "text": "Zabbix recoge información de equipos, almacena los registros y permite consultarlos en gráficas o valores. También puede detectar condiciones de problema. En este montaje comprobarás primero que los datos pertenecen al equipo correcto y que se pueden recuperar. Abrir una página bonita no demuestra que la recolección funcione."}, {"type": "code", "text": "SRV con agente ──> MON con Zabbix ──> PostgreSQL\nR1 y SW1 SNMP ───>         │\n                    Apache y PHP\n                          │\n                Navegador en Windows físico"}, {"type": "table", "heads": ["Componente", "Qué significa y para qué sirve"], "rows": [["Ubuntu Server", "Sistema operativo sin escritorio gráfico en este recorrido; ejecuta los servicios del laboratorio."], ["Zabbix server", "Proceso de MON que planifica consultas y procesa los resultados."], ["PostgreSQL", "Motor de base de datos que guarda configuración e historial en MON."], ["Apache y PHP", "Servidor web y entorno que presentan la interfaz de Zabbix al navegador."], ["Zabbix agent 2", "Programa que se instala en el equipo observado para responder consultas de recursos."], ["SNMP", "Protocolo para consultar objetos de gestión en router y switch."], ["ICMP", "Mecanismo de mensajes de red que permite comprobar respuesta de un destino."]]}, {"type": "p", "text": "En el agente pasivo, MON inicia la consulta y SRV responde. En SNMP, MON consulta R1 o SW1. El navegador no sustituye al servidor Zabbix: cerrar el navegador no detiene la recolección mientras MON y los demás equipos continúen funcionando."}]}, {"id": 2, "title": "Preparar recursos y reconocer las instrucciones", "blocks": [{"type": "p", "text": "Necesitas un PC x64 con virtualización habilitada, permisos de instalación, conexión a Internet y espacio para las VMs. La propuesta usa 16 GB de RAM en el PC y al menos 80 GB libres para archivos e instantáneas. Es un dimensionamiento didáctico para pocos equipos, no una especificación empresarial."}, {"type": "table", "heads": ["VM", "Memoria", "CPU virtual", "Disco"], "rows": [["MON-E01", "4096 MB", "2", "35 GB VDI dinámico"], ["SRV-E01", "2048 MB", "1 o 2", "20 GB VDI dinámico"]]}, {"type": "p", "text": "Dispondrás de un router MikroTik y un switch Cisco Catalyst, o de otra combinación compatible. Identifica el modelo y el sistema antes de usar una ruta de comandos. Un MikroTik puede ejecutar RouterOS o SwOS; no utilizan el mismo método de configuración. Otros modelos se incorporan únicamente cuando compruebes su manual y soporte SNMP."}, {"type": "h", "text": "Cómo leer los bloques"}, {"type": "p", "text": "«Windows físico» indica una ventana de Windows, no una terminal de Ubuntu. «Consola MON» indica la ventana de esa VM o su sesión SSH. «Consola SRV» identifica la segunda VM. «Archivo de configuración» indica que debes pegar texto dentro de un editor, no ejecutarlo como comando."}, {"type": "p", "text": "Cada bloque de comandos explica qué hace y qué resultado debes comprobar. Escribe los caracteres tal como aparecen, sin agregar $ o # del prompt. Las mayúsculas importan en Linux. Una línea que devuelve el prompt sin texto puede haber terminado correctamente; una línea que muestra Error requiere revisar el mensaje."}, {"type": "h", "text": "Archivos y credenciales del equipo"}, {"type": "p", "text": "En Windows crea una carpeta A1_E01 con subcarpetas capturas y registros. Crea también Ficha_tecnica_E01.docx para documentar cada fase. Conserva las contraseñas en un medio privado, separadas de la ficha. Habrá claves distintas para Ubuntu, PostgreSQL, Zabbix y los equipos físicos."}, {"type": "p", "text": "Trabaja con dispositivos de laboratorio aislados. Antes de modificar una configuración existente, guarda su estado. No restablezcas equipos a fábrica ni borres bases de datos como intento de diagnóstico."}]}, {"id": 3, "title": "Instalar VirtualBox y obtener Ubuntu", "blocks": [{"type": "h", "text": "Paso 1 Revisar la virtualización en Windows físico"}, {"type": "p", "text": "Abre Administrador de tareas → Rendimiento → CPU y comprueba Virtualización. Debe estar habilitada. Si está deshabilitada, identifica en el manual del PC la opción Intel VT-x o AMD-V de BIOS o UEFI y habilítala con acceso autorizado. Si el equipo administrado no permite ese cambio, registra el bloqueo; crear VMs no lo soluciona."}, {"type": "h", "text": "Paso 2 Instalar el hipervisor en Windows físico"}, {"type": "p", "text": "Abre https://www.virtualbox.org/wiki/Downloads y descarga el instalador para Windows x64. Ejecuta el instalador y conserva los componentes de red. Acepta los permisos necesarios; si pide reiniciar, guarda los archivos y reinicia. Abre VirtualBox Manager. No necesitas Extension Pack para esta práctica."}, {"type": "p", "text": "VirtualBox es el programa que creará las VMs. Su instalación no instala Ubuntu ni Zabbix. No selecciones dispositivos de almacenamiento físico para las VMs: usarás archivos de disco VDI."}, {"type": "h", "text": "Paso 3 Descargar la imagen de Ubuntu Server"}, {"type": "p", "text": "Abre https://releases.ubuntu.com/24.04/ y descarga Server install image de 64 bits para PC AMD64. El nombre contiene live-server-amd64.iso. amd64 sirve para PC x64 Intel o AMD; no significa que se requiera procesador AMD. Guarda la ISO en una carpeta estable y registra su nombre exacto."}, {"type": "p", "text": "La ISO representa un medio de instalación, como un DVD virtual. Se usará para instalar Ubuntu en el disco virtual. No descargues Ubuntu Desktop para este procedimiento y no elijas una imagen ARM si tu computador es x64."}, {"type": "verify", "text": "VirtualBox abre y tienes el archivo ISO de Ubuntu Server 24.04 LTS amd64. Todavía no existe ningún servidor. El próximo paso crea únicamente la red virtual común."}]}, {"id": 4, "title": "Crear la red virtual de administración", "blocks": [{"type": "h", "text": "Paso 4 Crear la red solo anfitrión"}, {"type": "p", "text": "En VirtualBox Manager abre Herramientas → Red o Archivo → Herramientas → Administrador de red. En la sección de redes solo anfitrión crea un adaptador. Selecciona configuración manual IPv4: dirección 192.168.56.1, máscara 255.255.255.0. Desactiva DHCP de esa red y guarda. Registra el nombre del adaptador."}, {"type": "p", "text": "Solo anfitrión conecta Windows con las VMs y las VMs entre sí, dentro de este PC. Su dirección .1 pertenece al adaptador virtual de Windows; no será la dirección de Zabbix ni la puerta de enlace de Ubuntu."}, {"type": "h", "text": "Las tarjetas virtuales cumplen funciones diferentes"}, {"type": "table", "heads": ["Tarjeta", "Modo", "Para qué se usará"], "rows": [["Adaptador 1", "NAT", "Ubuntu descarga paquetes usando la conexión de Windows."], ["Adaptador 2", "Solo anfitrión", "Windows abre el panel y MON consulta a SRV en 192.168.56.0/24."], ["Adaptador 3 de MON", "Puente sobre Ethernet físico", "Se agregará después para consultar R1 y SW1 físicos en otra subred."]]}, {"type": "p", "text": "NAT traduce conexiones de la VM hacia redes externas. Dos VMs con NAT individual pueden mostrar la misma dirección 10.0.2.15 en sus redes privadas; no utilizarás esa dirección para que MON consulte a SRV. La red solo anfitrión tendrá direcciones diferentes y persistentes."}, {"type": "table", "heads": ["Equipo o interfaz", "Dirección propuesta"], "rows": [["Windows solo anfitrión", "192.168.56.1/24"], ["MON adaptador 2", "192.168.56.10/24"], ["SRV adaptador 2", "192.168.56.20/24"]]}, {"type": "p", "text": "Estos ejemplos suponen una red local de VirtualBox por PC. Si una red existente o VPN ya usa esa subred, elige una subred privada libre y cambia todas sus apariciones de manera consistente. No cambies la IP del Wi-Fi ni la del Ethernet físico en este paso."}, {"type": "verify", "text": "el adaptador solo anfitrión existe, tiene .56.1/24 y no ofrece DHCP. A partir de aquí construirás MON completo antes de comenzar SRV."}]}, {"id": 5, "title": "Crear la máquina virtual MON", "blocks": [{"type": "p", "text": "Estás iniciando la instalación completa de MON-E01. Esta VM tendrá Ubuntu Server y un disco propio. Trabaja en VirtualBox Manager del Windows físico."}, {"type": "h", "text": "Crear la VM y su disco"}, {"type": "p", "text": "1. Pulsa Nueva. Escribe MON-E01. Selecciona la ISO Ubuntu Server 24.04 LTS amd64 y marca omitir instalación desatendida. Si debes elegir el tipo manualmente, selecciona Linux y Ubuntu de 64 bits."}, {"type": "p", "text": "2. Asigna 4096 MB de RAM y 2 CPU virtuales."}, {"type": "p", "text": "3. Crea un disco nuevo VDI de 35 GB con asignación dinámica. VDI es un archivo que Ubuntu tratará como un disco; dinámico significa que su archivo crece conforme se utiliza hasta el límite establecido. No selecciones un disco físico ni un VDI que ya contiene otra VM."}, {"type": "h", "text": "Configurar sus adaptadores antes de encender"}, {"type": "p", "text": "Con la VM apagada, abre Configuración → Red. Adaptador 1: habilitado, NAT y Cable conectado. Adaptador 2: habilitado, Adaptador solo anfitrión, elige el nombre creado en la preparación y deja Cable conectado. No actives un puente en este punto."}, {"type": "p", "text": "En Almacenamiento comprueba que la unidad óptica tiene montada la ISO. El disco VDI y la unidad óptica son dispositivos distintos: el primero guardará Ubuntu y la segunda contiene su instalador."}, {"type": "h", "text": "Arrancar el instalador"}, {"type": "p", "text": "Pulsa Iniciar y selecciona Try or Install Ubuntu Server. Usa flechas y Tab para moverte, Espacio para marcar opciones y Enter para confirmar. La tecla anfitrión mostrada por VirtualBox devuelve el control del ratón a Windows."}, {"type": "verify", "text": "la ventana se llama MON-E01, el VDI es de 35 GB y la ISO arranca. Si vuelve a Windows, estás fuera de la VM; no ejecutes allí comandos de Ubuntu."}]}, {"id": 6, "title": "Instalar Ubuntu dentro de MON", "blocks": [{"type": "p", "text": "Completa estas pantallas dentro de la ventana MON-E01. Las opciones pertenecen a la VM, no al disco de Windows. El texto de las pantallas puede variar entre revisiones de la ISO."}, {"type": "h", "text": "Idioma y teclado"}, {"type": "p", "text": "Selecciona English para que los mensajes coincidan con la guía y el teclado que corresponda al teclado físico, por ejemplo Spanish. Puedes probar caracteres en el campo de prueba. Si el teclado no coincide, símbolos como /, : y @ pueden escribirse mal."}, {"type": "h", "text": "Actualización del instalador y tipo de sistema"}, {"type": "p", "text": "Si ofrece actualizar el instalador, puedes continuar con la versión incluida en la ISO. Elige Ubuntu Server estándar, no una instalación de escritorio. Esta elección instala los componentes básicos del sistema; Zabbix todavía no se instala."}, {"type": "h", "text": "Red durante la instalación"}, {"type": "p", "text": "En Network connections identifica la tarjeta NAT, normalmente enp0s3, que debe obtener IPv4 por DHCP. La segunda tarjeta suele ser enp0s8; puedes dejar su IPv4 desactivada durante la instalación. Al finalizar le pondrás una dirección fija. No configures aquí una puerta de enlace en la tarjeta solo anfitrión."}, {"type": "p", "text": "En Proxy deja el campo vacío si la conexión no utiliza proxy. En Ubuntu archive mirror conserva un espejo oficial que supere la comprobación de conexión. Si el centro usa un proxy conocido, introduce sus datos reales; no inventes una dirección para saltar el error."}, {"type": "h", "text": "Elegir el almacenamiento virtual"}, {"type": "p", "text": "En Guided storage selecciona usar el disco completo de 35 GB. Para mantener este recorrido simple, desmarca LVM si está marcado y no actives cifrado del disco. Revisa el resumen y confirma el borrado únicamente sobre ese VDI nuevo. La confirmación prepara el disco virtual de MON-E01."}, {"type": "p", "text": "LVM administra volúmenes lógicos y es válido en otros diseños; aquí se evita para reducir componentes. No agregues unidades USB ni discos físicos a la VM. Si el tamaño no coincide con el VDI creado, regresa y comprueba qué disco seleccionaste."}, {"type": "verify", "text": "la pantalla de almacenamiento identifica el disco virtual correcto y puedes continuar a la creación del perfil."}]}, {"id": 7, "title": "Completar la instalación y entrar en MON", "blocks": [{"type": "h", "text": "Crear el usuario de Ubuntu"}, {"type": "p", "text": "En Profile setup escribe un nombre descriptivo, hostname mon-e01, usuario aprendiz y una contraseña propia. hostname identifica el sistema en la red y en el prompt. El usuario aprendiz tendrá permiso para solicitar operaciones administrativas mediante sudo. No uses el nombre del otro servidor."}, {"type": "p", "text": "Omite la suscripción Ubuntu Pro si aparece. Marca Install OpenSSH server. SSH es el servicio que permite abrir una terminal remota desde Windows. No selecciones aplicaciones de Featured Server Snaps; los paquetes necesarios se instalarán explícitamente."}, {"type": "h", "text": "Finalizar y retirar el instalador"}, {"type": "p", "text": "Cuando aparezca Installation complete pulsa Reboot Now. Si solicita quitar el medio, en el menú de VirtualBox abre Dispositivos → Unidades ópticas → Quitar disco de la unidad virtual y confirma el reinicio. Si vuelve al instalador, retira la ISO y arranca desde el VDI, sin iniciar otra instalación."}, {"type": "p", "text": "En login escribe aprendiz y después su contraseña. Al introducir contraseñas en Linux no se muestran asteriscos. El prompt esperado incluye aprendiz@mon-e01. Es una terminal de Ubuntu de MON, no PowerShell."}, {"type": "command", "where": "consola de MON", "text": "hostname\ncat /etc/os-release\nfree -h\ndf -h /", "why": "hostname muestra el nombre del sistema. cat lee el archivo que identifica Ubuntu. free -h muestra memoria con unidades legibles. df -h / muestra capacidad y uso del sistema de archivos raíz, donde está instalado el sistema.", "result": "hostname devuelve mon-e01; el sistema indica Ubuntu 24.04; hay memoria y espacio de disco asignados a esta VM."}, {"type": "h", "text": "Cómo escribir y editar"}, {"type": "p", "text": "sudo solicita privilegios para un comando; puede pedir la contraseña de aprendiz. nano abre un editor de texto: Ctrl+O y Enter guardan, Ctrl+X sale, Ctrl+W busca. Una ruta que comienza por / se refiere a un archivo o directorio de Ubuntu, no a una carpeta C: de Windows."}, {"type": "verify", "text": "has iniciado sesión en MON-E01 desde su disco y guardaste una evidencia del sistema instalado."}]}, {"id": 8, "title": "Configurar la dirección fija de MON", "blocks": [{"type": "command", "where": "consola de MON", "text": "ip -br address\nip route\nls /etc/netplan", "why": "ip -br address resume interfaces y direcciones; ip route muestra por dónde se alcanzan las redes; ls enumera los archivos de configuración Netplan. Netplan transforma el archivo YAML en configuración de red persistente.", "result": "reconoces la tarjeta NAT y la tarjeta solo anfitrión, y ves el archivo YAML existente."}, {"type": "p", "text": "Los ejemplos usan enp0s3 para NAT y enp0s8 para solo anfitrión. Si tus nombres difieren, identifica cada tarjeta por su MAC en VirtualBox → Configuración → Red → Avanzado y reemplázalos. El archivo suele ser 50-cloud-init.yaml; si tiene otro nombre, usa ese nombre en todos los comandos siguientes. No crees un segundo archivo que contradiga al primero."}, {"type": "command", "where": "consola de MON", "text": "sudo cp -a /etc/netplan /etc/netplan.respaldo-a1\nsudo nano /etc/netplan/50-cloud-init.yaml", "why": "cp -a conserva una copia de la carpeta con sus atributos para recuperar la configuración. nano abre el archivo real de red; edítalo solo después de identificarlo.", "result": "se abre el archivo que ya existía. Si nano muestra un archivo nuevo cuando esperabas el existente, sal y revisa el nombre."}, {"type": "p", "text": "Contenido del archivo para MON. Escribe espacios, no tabulaciones. El nivel de sangría indica qué parámetros pertenecen a cada interfaz."}, {"type": "code", "text": "network:\n  version: 2\n  ethernets:\n    enp0s3:\n      dhcp4: true\n    enp0s8:\n      dhcp4: false\n      addresses:\n        - 192.168.56.10/24"}, {"type": "p", "text": "network abre la configuración de red; version: 2 identifica el formato de Netplan y ethernets agrupa tarjetas Ethernet. addresses contiene direcciones fijas. dhcp4: true obtiene parámetros automáticamente en NAT; false lo desactiva en la otra tarjeta. /24 equivale a 255.255.255.0. No pongas gateway ni DNS en solo anfitrión: NAT proporciona la salida."}, {"type": "command", "where": "consola de MON", "text": "sudo chmod 600 /etc/netplan/50-cloud-init.yaml\nsudo netplan generate\nsudo netplan try", "why": "chmod 600 permite leer y escribir el archivo solo a su propietario. generate valida y genera la configuración. try prueba la red y pide confirmación; si no confirmas puede revertirla.", "result": "no hay errores YAML y, tras confirmar, ip -br address muestra 192.168.56.10/24 en la interfaz del laboratorio."}]}, {"id": 9, "title": "Preparar utilidades y acceso remoto de MON", "blocks": [{"type": "command", "where": "consola de MON", "text": "sudo apt update\nsudo apt install -y wget curl nano openssh-server\nsudo systemctl enable --now ssh", "why": "apt update descarga índices de paquetes. apt install instala los paquetes nombrados y -y acepta las confirmaciones ordinarias. wget y curl consultan o descargan recursos web; nano edita texto. systemctl enable --now ssh inicia SSH y lo habilita al arrancar.", "result": "la instalación termina sin errores y el servicio SSH está disponible. No borres archivos de bloqueo si otra instalación de paquetes está trabajando."}, {"type": "command", "where": "consola de MON", "text": "sudo timedatectl set-timezone America/Bogota\nsudo timedatectl set-ntp true\ntimedatectl\ndate --iso-8601=seconds", "why": "la primera orden fija la zona para mostrar fechas; la segunda habilita sincronización de reloj. timedatectl muestra su estado y date imprime una fecha con zona. La marca temporal permite relacionar lecturas de equipos distintos.", "result": "zona America/Bogota y fecha coherente con Windows. Si no sincroniza, revisa Internet y el servicio de tiempo antes de comparar eventos."}, {"type": "command", "where": "PowerShell o Terminal del Windows físico", "text": "ssh aprendiz@192.168.56.10", "why": "ssh abre una sesión remota en MON con el usuario aprendiz. Acepta la huella solo tras verificar la IP. La contraseña es la de Ubuntu de MON, no la de Windows.", "result": "el prompt cambia a aprendiz@mon-e01. Desde ese prompt los comandos se ejecutan en MON. exit cierra SSH y devuelve a Windows."}, {"type": "p", "text": "Si Windows indica que ssh no existe, instala OpenSSH Client desde Características opcionales de Windows o usa PuTTY con tipo SSH, dirección 192.168.56.10 y puerto 22. La consola de VirtualBox sigue siendo válida para el resto del montaje."}, {"type": "verify", "text": "MON tiene su Ubuntu, IP persistente, conectividad de descarga y acceso de administración. Continúa con Zabbix en MON; todavía no crees SRV."}]}, {"id": 10, "title": "MON Instalar el repositorio de Zabbix", "blocks": [{"type": "p", "text": "Un repositorio es una fuente de paquetes de software. Ubuntu ya tiene sus repositorios; añadirás el oficial de Zabbix para instalar la rama 7.0 LTS compatible con Ubuntu 24.04. LTS identifica una rama de soporte prolongado. No mezcles paquetes de otra distribución o rama."}, {"type": "h", "text": "Elegir la combinación correcta"}, {"type": "p", "text": "En Windows físico abre https://www.zabbix.com/download y selecciona Zabbix 7.0 LTS, Ubuntu 24.04, Server Frontend Agent 2, PostgreSQL y Apache. La guía utiliza esa combinación. Registra la revisión exacta 7.0.x que se instale; no presentes 7.0 como si identificara todas sus revisiones."}, {"type": "command", "where": "MON mediante su consola o SSH", "text": "cd /tmp\nrepo=https://repo.zabbix.com/zabbix/7.0/ubuntu/pool/main/z\nrepo=\"$repo/zabbix-release\"\nwget \"$repo/zabbix-release_latest_7.0+ubuntu24.04_all.deb\"\nsudo dpkg -i zabbix-release_latest_7.0+ubuntu24.04_all.deb\nsudo apt update", "why": "cd /tmp cambia a una carpeta temporal. repo= guarda una dirección en una variable; $repo recupera su contenido. wget descarga el archivo .deb. dpkg -i instala el paquete que registra la fuente oficial; no es todavía el servidor Zabbix. apt update incorpora sus índices.", "result": "el archivo se descarga, dpkg no presenta errores y apt puede leer la fuente de Zabbix."}, {"type": "p", "text": "Las comillas dobles permiten usar la variable y conservar la URL como una sola expresión. Las dos asignaciones repo construyen el enlace sin partirlo por error. Si wget devuelve 404, verifica el enlace de Ubuntu 24.04 y rama 7.0 en el selector; no continúes con un archivo inexistente."}, {"type": "verify", "text": "MON tiene registrada la fuente oficial. Esta fase se ejecuta en MON, no en Windows ni en el router."}]}, {"id": 11, "title": "MON Instalar servidor base de datos y panel", "blocks": [{"type": "command", "where": "MON", "text": "sudo apt install -y postgresql zabbix-server-pgsql \\\n  zabbix-frontend-php php8.3-pgsql zabbix-apache-conf \\\n  zabbix-sql-scripts zabbix-agent2 zabbix-get fping snmp", "why": "apt instala los componentes indicados. La barra invertida al final continúa el mismo comando en la línea siguiente; no pongas espacios después de ella. Puedes pegar el bloque completo.", "result": "la instalación de paquetes finaliza sin errores. Es normal que el servidor Zabbix todavía no funcione: falta crear su base y configurar la conexión."}, {"type": "table", "heads": ["Paquete", "Para qué se instala en MON"], "rows": [["postgresql", "Motor de base de datos."], ["zabbix-server-pgsql", "Servidor Zabbix preparado para PostgreSQL."], ["zabbix-frontend-php y php8.3-pgsql", "Panel web y conector PHP hacia PostgreSQL."], ["zabbix-apache-conf", "Configuración de Apache para publicar el panel."], ["zabbix-sql-scripts", "Archivo con tablas y datos iniciales."], ["zabbix-agent2", "Permite consultar los recursos del propio MON."], ["zabbix-get", "Cliente para probar consultas al agente."], ["fping", "Herramienta utilizada para consultas ICMP."], ["snmp", "Clientes snmpget y snmpwalk para probar equipos físicos."]]}, {"type": "command", "where": "MON", "text": "sudo systemctl enable --now postgresql\npg_isready\napt-cache policy zabbix-server-pgsql", "why": "enable --now habilita PostgreSQL al arrancar y lo inicia. pg_isready comprueba si acepta conexiones. apt-cache policy muestra versión instalada y fuentes disponibles del paquete.", "result": "PostgreSQL acepta conexiones y zabbix-server-pgsql tiene una versión instalada de rama 7.0."}]}, {"id": 12, "title": "MON Crear el usuario y la base de datos", "blocks": [{"type": "p", "text": "La base de datos guarda la configuración y las mediciones. Se llama zabbix y su propietario también se llamará zabbix, pero una base y un usuario son objetos distintos. El usuario postgres administra el motor. La cuenta de sistema zabbix pertenece al paquete y permite ejecutar procesos locales con esa identidad."}, {"type": "h", "text": "Elegir la contraseña de PostgreSQL"}, {"type": "p", "text": "Elige una clave propia y consérvala de manera privada. La llamaremos CLAVE_BD en las explicaciones; no uses ese texto como contraseña. Esta clave será igual en PostgreSQL, zabbix_server.conf y el asistente web. No es la clave de aprendiz ni la clave de Admin del panel."}, {"type": "command", "where": "MON", "text": "sudo -u postgres createuser --pwprompt zabbix", "why": "sudo -u postgres ejecuta createuser con la identidad administrativa de PostgreSQL. --pwprompt pide la nueva contraseña sin escribirla en el comando. Puede aparecer primero la solicitud de contraseña de sudo, que corresponde a aprendiz.", "result": "escribes dos veces la clave elegida para el usuario zabbix y la orden termina sin error."}, {"type": "command", "where": "MON", "text": "sudo -u postgres createdb -O zabbix -E Unicode -T template0 zabbix", "why": "createdb crea la base. -O fija su propietario; -E selecciona codificación Unicode; -T elige una plantilla limpia. El último zabbix es el nombre de la nueva base.", "result": "se crea una base vacía llamada zabbix. Que no aparezca texto no implica error."}, {"type": "p", "text": "Si indica que el usuario o la base ya existe, no repitas la creación ni los borres. Puede que ya hayas completado esa parte. Comprueba el estado con la siguiente orden:"}, {"type": "command", "where": "MON", "text": "sudo -u postgres psql -l", "why": "psql es el cliente de PostgreSQL; -l enumera bases y sus propietarios sin modificarlas.", "result": "la lista contiene zabbix con propietario zabbix. Si ves un paginador, la tecla q permite salir."}, {"type": "verify", "text": "la base existe y conoces su clave. Aún no contiene las tablas del programa."}]}, {"id": 13, "title": "MON Importar la estructura inicial", "blocks": [{"type": "p", "text": "Instalar PostgreSQL crea el motor, pero no las tablas de Zabbix. Importar significa ejecutar el archivo SQL del paquete para construir esas tablas y sus datos iniciales. Se hace una sola vez sobre la base nueva."}, {"type": "command", "where": "MON", "text": "ls -l /usr/share/zabbix-sql-scripts/postgresql/server.sql.gz", "why": "ls -l muestra detalles del archivo comprimido que contiene el esquema de Zabbix. La ruta pertenece a los paquetes que instalaste en MON.", "result": "el archivo existe. Si no existe, revisa la instalación de zabbix-sql-scripts y no escribas otra ruta al azar."}, {"type": "command", "where": "MON", "text": "zcat /usr/share/zabbix-sql-scripts/postgresql/server.sql.gz \\\n  | sudo -u zabbix psql -v ON_ERROR_STOP=1 zabbix", "why": "zcat descomprime hacia la salida. La tubería | entrega ese texto a psql. sudo -u zabbix ejecuta el cliente como la cuenta de sistema del propietario. -v ON_ERROR_STOP=1 detiene la ejecución si hay un error SQL; el último zabbix identifica la base destino.", "result": "aparecen mensajes de creación e inserción y regresa el prompt sin un error SQL. No cierres la sesión mientras trabaja."}, {"type": "command", "where": "MON", "text": "sudo -u postgres psql -d zabbix -c \"SELECT count(*) FROM hosts;\"\npsql -h 127.0.0.1 -U zabbix -d zabbix -W -c \"SELECT 1;\"", "why": "-d elige la base y -c ejecuta la consulta entre comillas. count(*) cuenta registros de la tabla hosts. En la segunda prueba, -h usa TCP local, -U selecciona el usuario y -W solicita su contraseña; SELECT 1 prueba acceso sin cambiar datos.", "result": "el conteo es mayor que cero y, tras escribir CLAVE_BD, la segunda consulta devuelve 1."}, {"type": "p", "text": "Si aparece relation already exists, puede haberse importado antes. Si falla la contraseña, comprueba que utilizas la de PostgreSQL. No vuelvas a importar sobre tablas parciales ni borres una base para ocultar el error: conserva el mensaje y diagnostica la causa."}, {"type": "verify", "text": "las tablas iniciales existen y el usuario zabbix puede conectarse por TCP con su clave."}]}, {"id": 14, "title": "MON Conectar Zabbix con su base", "blocks": [{"type": "command", "where": "MON", "text": "sudo cp /etc/zabbix/zabbix_server.conf /etc/zabbix/zabbix_server.conf.a1\nsudo nano /etc/zabbix/zabbix_server.conf", "why": "cp guarda una copia del archivo antes de editar. nano abre la configuración del proceso zabbix-server. El archivo .a1 sirve para recuperar valores anteriores, no para activar dos configuraciones.", "result": "se abre el archivo de configuración del servidor en MON."}, {"type": "p", "text": "Busca cada parámetro con Ctrl+W y deja una única línea activa con el valor indicado. Las líneas que empiezan por # son comentarios. Sustituye CLAVE_BD por la clave real, sin añadir comillas. No pegues estas líneas en la terminal."}, {"type": "code", "text": "DBHost=localhost\nDBName=zabbix\nDBUser=zabbix\nDBPassword=CLAVE_BD"}, {"type": "table", "heads": ["Parámetro", "Significado"], "rows": [["DBHost", "Dónde está PostgreSQL. localhost se refiere al propio MON, porque el proceso corre allí."], ["DBName", "Base a la que se conecta: zabbix."], ["DBUser", "Usuario de PostgreSQL con permiso sobre esa base."], ["DBPassword", "Contraseña de ese usuario; debe coincidir con la elegida al crearlo."]]}, {"type": "p", "text": "Guarda con Ctrl+O y Enter, y sal con Ctrl+X. No fotografíes la contraseña ni la incluyas en la ficha. Una clave equivocada permite que Apache funcione, pero impide que el servidor Zabbix recolecte y guarde normalmente."}, {"type": "command", "where": "MON", "text": "sudo systemctl restart zabbix-server\nsystemctl is-active zabbix-server", "why": "restart vuelve a iniciar el proceso para que lea los cambios. is-active consulta su estado sin modificarlo.", "result": "la respuesta es active. Si no lo está, usa el registro que se muestra en la sección de diagnóstico antes de avanzar."}, {"type": "verify", "text": "el proceso se conecta a PostgreSQL con la configuración guardada. Todavía debes preparar el panel web."}]}, {"id": 15, "title": "MON Activar Apache PHP y los servicios", "blocks": [{"type": "p", "text": "Apache recibe las solicitudes HTTP del navegador. PHP ejecuta el código del panel. Configurar la zona horaria de PHP ayuda a mostrar fechas coherentes con Ubuntu y el perfil de Zabbix; esto no sustituye la sincronización del reloj."}, {"type": "command", "where": "MON", "text": "sudo nano /etc/php/8.3/apache2/conf.d/99-laboratorio.ini", "why": "abre un archivo nuevo de configuración adicional de PHP para Apache. Esta ruta corresponde a PHP 8.3 de Ubuntu 24.04 en la combinación elegida.", "result": "puedes escribir las dos líneas siguientes dentro del editor y guardar el archivo."}, {"type": "code", "text": "[Date]\ndate.timezone = America/Bogota"}, {"type": "p", "text": "[Date] agrupa parámetros de fecha. date.timezone define la zona de representación. Guarda el archivo y sal del editor antes de ejecutar el siguiente bloque."}, {"type": "command", "where": "MON", "text": "sudo locale-gen en_US.UTF-8 es_CO.UTF-8\nsudo systemctl restart zabbix-server zabbix-agent2 apache2\nsudo systemctl enable zabbix-server zabbix-agent2 apache2\nsystemctl is-active zabbix-server zabbix-agent2 apache2\ncurl -I http://127.0.0.1/zabbix/", "why": "locale-gen prepara idiomas y codificaciones que puede utilizar el panel. restart aplica cambios de servicios; enable hace que arranquen con el sistema. is-active consulta sus estados. curl -I solicita las cabeceras HTTP del panel desde MON.", "result": "hay tres estados active y una respuesta HTTP del panel, normalmente 200 o una redirección. Una respuesta 404 obliga a revisar la ruta /zabbix/."}, {"type": "h", "text": "Si tienes UFW activo"}, {"type": "command", "where": "MON", "text": "sudo ufw status", "why": "ufw status consulta si el cortafuegos del sistema está activo. El cortafuegos filtra conexiones; que esté instalado no significa que esté habilitado.", "result": "si dice inactive no necesitas reglas para esta fase; si dice active, permite solo los accesos siguientes."}, {"type": "code", "text": "sudo ufw allow from 192.168.56.1 to any port 80 proto tcp\nsudo ufw allow from 192.168.56.1 to any port 22 proto tcp"}, {"type": "p", "text": "Estas reglas, solo si UFW está activo, permiten el panel HTTP y SSH desde el Windows solo anfitrión. No abren PostgreSQL. No deshabilites todo el cortafuegos para resolver un puerto."}]}, {"id": 16, "title": "MON Completar el asistente web", "blocks": [{"type": "p", "text": "Vuelve al navegador del Windows físico. Escribe http://192.168.56.10/zabbix/. Aquí localhost sería Windows, por eso debes usar la IP de MON. Ver una página de Apache sin Zabbix suele indicar que faltó /zabbix/ en la dirección."}, {"type": "h", "text": "Pantallas del asistente en orden"}, {"type": "p", "text": "1. Welcome: selecciona English para que los nombres coincidan con esta guía y continúa. Si el idioma no aparece, revisa los locales generados y Apache."}, {"type": "p", "text": "2. Check of pre-requisites: revisa que los requisitos obligatorios indiquen OK. Si alguno falla, corrige el módulo o parámetro descrito; no es una pregunta que puedas omitir."}, {"type": "p", "text": "3. Configure DB connection: elige PostgreSQL. Database host localhost, porque el panel PHP se ejecuta en MON. Usa puerto 5432 o el valor predeterminado representado por 0; base zabbix, usuario zabbix y tu CLAVE_BD. No actives cifrado de base sin haberlo configurado. Los campos de esquema pueden mantenerse en su valor predeterminado."}, {"type": "p", "text": "4. Settings: escribe LAB3399813-E01 como nombre del sistema y selecciona America/Bogota. Si aparecen host y puerto de Zabbix server, conserva localhost y 10051 para este montaje local."}, {"type": "p", "text": "5. Pre-installation summary: revisa que la base y el usuario sean correctos. Continúa a Install y finaliza únicamente cuando indique que se guardó la configuración."}, {"type": "h", "text": "Si no puede guardar la configuración del panel"}, {"type": "p", "text": "El asistente permite descargar zabbix.conf.php. Guarda ese archivo en Windows, sin compartirlo porque contiene la clave de base. Puedes copiarlo a MON desde la carpeta donde se descargó:"}, {"type": "command", "where": "PowerShell del Windows físico en la carpeta del archivo", "text": "scp ./zabbix.conf.php aprendiz@192.168.56.10:/tmp/zabbix.conf.php", "why": "scp copia el archivo local de Windows a /tmp de MON por SSH. ./ indica la carpeta actual. Utiliza la contraseña de aprendiz en MON.", "result": "el archivo queda en /tmp/zabbix.conf.php de MON. Si el asistente lo guardó correctamente, no necesitas esta ruta de recuperación."}, {"type": "code", "text": "sudo install -o root -g www-data -m 640 /tmp/zabbix.conf.php \\\n  /etc/zabbix/web/zabbix.conf.php"}, {"type": "p", "text": "Este último comando se ejecuta en MON solo para esa recuperación: install coloca el archivo, -o root define propietario, -g www-data el grupo de Apache y -m 640 permite lectura al grupo. Regresa al navegador y completa el asistente. No entregues ese archivo como evidencia."}]}, {"id": 17, "title": "MON Primer acceso y verificación del primer servidor", "blocks": [{"type": "h", "text": "Cambiar la credencial inicial del panel"}, {"type": "p", "text": "En una instalación nueva, entra con usuario Admin, A mayúscula, y clave zabbix. Abre User settings → Profile o Users → Users → Admin, según el menú visible, y cambia la contraseña. Guarda la nueva clave de manera privada y comprueba que puedes volver a entrar. La clave del panel no es la de aprendiz ni CLAVE_BD."}, {"type": "h", "text": "Comprobar el monitoreo local de MON"}, {"type": "p", "text": "Abre Data collection → Hosts y localiza el host inicial Zabbix server. Comprueba su interfaz Agent 127.0.0.1:10050 y el monitoreo por Server. El agente de MON suele permitir consultas de 127.0.0.1. Si el host no existe, créalo como MON-E01, grupo LAB3399813-E01, plantilla Linux by Zabbix agent e interfaz 127.0.0.1:10050. No dupliques el host si ya existe."}, {"type": "command", "where": "MON", "text": "zabbix_get -s 127.0.0.1 -k agent.ping\nzabbix_server -V | head -n 2", "why": "zabbix_get solicita una clave del agente; -s indica el destino y -k el dato. agent.ping prueba la respuesta del agente, no ICMP. -V muestra la versión del servidor; la tubería a head -n 2 limita la salida a sus primeras dos líneas.", "result": "agent.ping devuelve 1 y registras la revisión exacta 7.0.x del servidor."}, {"type": "p", "text": "En Monitoring → Latest data filtra el host de MON y recupera una lectura reciente. Si existe un error, abre el detalle del ítem y comprueba el agente antes de atribuirlo a la gráfica."}, {"type": "h", "text": "Punto de comprobación del primer servidor"}, {"type": "table", "heads": ["Debes poder demostrar", "Resultado propio"], "rows": [["Ubuntu instalado y MON con IP .56.10", "________________"], ["PostgreSQL con tablas y acceso validado", "________________"], ["zabbix-server y Apache activos", "________________"], ["Panel accesible desde Windows físico", "________________"], ["Clave web cambiada y versión registrada", "________________"], ["Agente local de MON devuelve 1", "________________"]]}, {"type": "verify", "text": "MON está completo y debe permanecer encendido. A partir de la siguiente sección instalarás el segundo servidor desde su propia VM vacía. No vuelvas a instalar la base de datos en SRV."}]}, {"id": 18, "title": "Crear la máquina virtual SRV", "blocks": [{"type": "p", "text": "Estás iniciando la instalación completa de SRV-E01. Esta VM tendrá Ubuntu Server y un disco propio. Trabaja en VirtualBox Manager del Windows físico."}, {"type": "h", "text": "Crear la VM y su disco"}, {"type": "p", "text": "1. Pulsa Nueva. Escribe SRV-E01. Selecciona la ISO Ubuntu Server 24.04 LTS amd64 y marca omitir instalación desatendida. Si debes elegir el tipo manualmente, selecciona Linux y Ubuntu de 64 bits."}, {"type": "p", "text": "2. Asigna 2048 MB de RAM y 1 o 2 CPU virtuales."}, {"type": "p", "text": "3. Crea un disco nuevo VDI de 20 GB con asignación dinámica. VDI es un archivo que Ubuntu tratará como un disco; dinámico significa que su archivo crece conforme se utiliza hasta el límite establecido. No selecciones un disco físico ni un VDI que ya contiene otra VM."}, {"type": "h", "text": "Configurar sus adaptadores antes de encender"}, {"type": "p", "text": "Con la VM apagada, abre Configuración → Red. Adaptador 1: habilitado, NAT y Cable conectado. Adaptador 2: habilitado, Adaptador solo anfitrión, elige el nombre creado en la preparación y deja Cable conectado. No actives un puente en este punto."}, {"type": "p", "text": "En Almacenamiento comprueba que la unidad óptica tiene montada la ISO. El disco VDI y la unidad óptica son dispositivos distintos: el primero guardará Ubuntu y la segunda contiene su instalador."}, {"type": "h", "text": "Arrancar el instalador"}, {"type": "p", "text": "Pulsa Iniciar y selecciona Try or Install Ubuntu Server. Usa flechas y Tab para moverte, Espacio para marcar opciones y Enter para confirmar. La tecla anfitrión mostrada por VirtualBox devuelve el control del ratón a Windows."}, {"type": "verify", "text": "la ventana se llama SRV-E01, el VDI es de 20 GB y la ISO arranca. Si vuelve a Windows, estás fuera de la VM; no ejecutes allí comandos de Ubuntu."}]}, {"id": 19, "title": "Instalar Ubuntu dentro de SRV", "blocks": [{"type": "p", "text": "Completa estas pantallas dentro de la ventana SRV-E01. Las opciones pertenecen a la VM, no al disco de Windows. El texto de las pantallas puede variar entre revisiones de la ISO."}, {"type": "h", "text": "Idioma y teclado"}, {"type": "p", "text": "Selecciona English para que los mensajes coincidan con la guía y el teclado que corresponda al teclado físico, por ejemplo Spanish. Puedes probar caracteres en el campo de prueba. Si el teclado no coincide, símbolos como /, : y @ pueden escribirse mal."}, {"type": "h", "text": "Actualización del instalador y tipo de sistema"}, {"type": "p", "text": "Si ofrece actualizar el instalador, puedes continuar con la versión incluida en la ISO. Elige Ubuntu Server estándar, no una instalación de escritorio. Esta elección instala los componentes básicos del sistema; Zabbix todavía no se instala."}, {"type": "h", "text": "Red durante la instalación"}, {"type": "p", "text": "En Network connections identifica la tarjeta NAT, normalmente enp0s3, que debe obtener IPv4 por DHCP. La segunda tarjeta suele ser enp0s8; puedes dejar su IPv4 desactivada durante la instalación. Al finalizar le pondrás una dirección fija. No configures aquí una puerta de enlace en la tarjeta solo anfitrión."}, {"type": "p", "text": "En Proxy deja el campo vacío si la conexión no utiliza proxy. En Ubuntu archive mirror conserva un espejo oficial que supere la comprobación de conexión. Si el centro usa un proxy conocido, introduce sus datos reales; no inventes una dirección para saltar el error."}, {"type": "h", "text": "Elegir el almacenamiento virtual"}, {"type": "p", "text": "En Guided storage selecciona usar el disco completo de 20 GB. Para mantener este recorrido simple, desmarca LVM si está marcado y no actives cifrado del disco. Revisa el resumen y confirma el borrado únicamente sobre ese VDI nuevo. La confirmación prepara el disco virtual de SRV-E01."}, {"type": "p", "text": "LVM administra volúmenes lógicos y es válido en otros diseños; aquí se evita para reducir componentes. No agregues unidades USB ni discos físicos a la VM. Si el tamaño no coincide con el VDI creado, regresa y comprueba qué disco seleccionaste."}, {"type": "verify", "text": "la pantalla de almacenamiento identifica el disco virtual correcto y puedes continuar a la creación del perfil."}]}, {"id": 20, "title": "Completar la instalación y entrar en SRV", "blocks": [{"type": "h", "text": "Crear el usuario de Ubuntu"}, {"type": "p", "text": "En Profile setup escribe un nombre descriptivo, hostname srv-e01, usuario aprendiz y una contraseña propia. hostname identifica el sistema en la red y en el prompt. El usuario aprendiz tendrá permiso para solicitar operaciones administrativas mediante sudo. No uses el nombre del otro servidor."}, {"type": "p", "text": "Omite la suscripción Ubuntu Pro si aparece. Marca Install OpenSSH server. SSH es el servicio que permite abrir una terminal remota desde Windows. No selecciones aplicaciones de Featured Server Snaps; los paquetes necesarios se instalarán explícitamente."}, {"type": "h", "text": "Finalizar y retirar el instalador"}, {"type": "p", "text": "Cuando aparezca Installation complete pulsa Reboot Now. Si solicita quitar el medio, en el menú de VirtualBox abre Dispositivos → Unidades ópticas → Quitar disco de la unidad virtual y confirma el reinicio. Si vuelve al instalador, retira la ISO y arranca desde el VDI, sin iniciar otra instalación."}, {"type": "p", "text": "En login escribe aprendiz y después su contraseña. Al introducir contraseñas en Linux no se muestran asteriscos. El prompt esperado incluye aprendiz@srv-e01. Es una terminal de Ubuntu de SRV, no PowerShell."}, {"type": "command", "where": "consola de SRV", "text": "hostname\ncat /etc/os-release\nfree -h\ndf -h /", "why": "hostname muestra el nombre del sistema. cat lee el archivo que identifica Ubuntu. free -h muestra memoria con unidades legibles. df -h / muestra capacidad y uso del sistema de archivos raíz, donde está instalado el sistema.", "result": "hostname devuelve srv-e01; el sistema indica Ubuntu 24.04; hay memoria y espacio de disco asignados a esta VM."}, {"type": "h", "text": "Cómo escribir y editar"}, {"type": "p", "text": "sudo solicita privilegios para un comando; puede pedir la contraseña de aprendiz. nano abre un editor de texto: Ctrl+O y Enter guardan, Ctrl+X sale, Ctrl+W busca. Una ruta que comienza por / se refiere a un archivo o directorio de Ubuntu, no a una carpeta C: de Windows."}, {"type": "verify", "text": "has iniciado sesión en SRV-E01 desde su disco y guardaste una evidencia del sistema instalado."}]}, {"id": 21, "title": "Configurar la dirección fija de SRV", "blocks": [{"type": "command", "where": "consola de SRV", "text": "ip -br address\nip route\nls /etc/netplan", "why": "ip -br address resume interfaces y direcciones; ip route muestra por dónde se alcanzan las redes; ls enumera los archivos de configuración Netplan. Netplan transforma el archivo YAML en configuración de red persistente.", "result": "reconoces la tarjeta NAT y la tarjeta solo anfitrión, y ves el archivo YAML existente."}, {"type": "p", "text": "Los ejemplos usan enp0s3 para NAT y enp0s8 para solo anfitrión. Si tus nombres difieren, identifica cada tarjeta por su MAC en VirtualBox → Configuración → Red → Avanzado y reemplázalos. El archivo suele ser 50-cloud-init.yaml; si tiene otro nombre, usa ese nombre en todos los comandos siguientes. No crees un segundo archivo que contradiga al primero."}, {"type": "command", "where": "consola de SRV", "text": "sudo cp -a /etc/netplan /etc/netplan.respaldo-a1\nsudo nano /etc/netplan/50-cloud-init.yaml", "why": "cp -a conserva una copia de la carpeta con sus atributos para recuperar la configuración. nano abre el archivo real de red; edítalo solo después de identificarlo.", "result": "se abre el archivo que ya existía. Si nano muestra un archivo nuevo cuando esperabas el existente, sal y revisa el nombre."}, {"type": "p", "text": "Contenido del archivo para SRV. Escribe espacios, no tabulaciones. El nivel de sangría indica qué parámetros pertenecen a cada interfaz."}, {"type": "code", "text": "network:\n  version: 2\n  ethernets:\n    enp0s3:\n      dhcp4: true\n    enp0s8:\n      dhcp4: false\n      addresses:\n        - 192.168.56.20/24"}, {"type": "p", "text": "network abre la configuración de red; version: 2 identifica el formato de Netplan y ethernets agrupa tarjetas Ethernet. addresses contiene direcciones fijas. dhcp4: true obtiene parámetros automáticamente en NAT; false lo desactiva en la otra tarjeta. /24 equivale a 255.255.255.0. No pongas gateway ni DNS en solo anfitrión: NAT proporciona la salida."}, {"type": "command", "where": "consola de SRV", "text": "sudo chmod 600 /etc/netplan/50-cloud-init.yaml\nsudo netplan generate\nsudo netplan try", "why": "chmod 600 permite leer y escribir el archivo solo a su propietario. generate valida y genera la configuración. try prueba la red y pide confirmación; si no confirmas puede revertirla.", "result": "no hay errores YAML y, tras confirmar, ip -br address muestra 192.168.56.20/24 en la interfaz del laboratorio."}]}, {"id": 22, "title": "Preparar utilidades y acceso remoto de SRV", "blocks": [{"type": "command", "where": "consola de SRV", "text": "sudo apt update\nsudo apt install -y wget curl nano openssh-server\nsudo systemctl enable --now ssh", "why": "apt update descarga índices de paquetes. apt install instala los paquetes nombrados y -y acepta las confirmaciones ordinarias. wget y curl consultan o descargan recursos web; nano edita texto. systemctl enable --now ssh inicia SSH y lo habilita al arrancar.", "result": "la instalación termina sin errores y el servicio SSH está disponible. No borres archivos de bloqueo si otra instalación de paquetes está trabajando."}, {"type": "command", "where": "consola de SRV", "text": "sudo timedatectl set-timezone America/Bogota\nsudo timedatectl set-ntp true\ntimedatectl\ndate --iso-8601=seconds", "why": "la primera orden fija la zona para mostrar fechas; la segunda habilita sincronización de reloj. timedatectl muestra su estado y date imprime una fecha con zona. La marca temporal permite relacionar lecturas de equipos distintos.", "result": "zona America/Bogota y fecha coherente con Windows. Si no sincroniza, revisa Internet y el servicio de tiempo antes de comparar eventos."}, {"type": "command", "where": "PowerShell o Terminal del Windows físico", "text": "ssh aprendiz@192.168.56.20", "why": "ssh abre una sesión remota en SRV con el usuario aprendiz. Acepta la huella solo tras verificar la IP. La contraseña es la de Ubuntu de SRV, no la de Windows.", "result": "el prompt cambia a aprendiz@srv-e01. Desde ese prompt los comandos se ejecutan en SRV. exit cierra SSH y devuelve a Windows."}, {"type": "p", "text": "Si Windows indica que ssh no existe, instala OpenSSH Client desde Características opcionales de Windows o usa PuTTY con tipo SSH, dirección 192.168.56.20 y puerto 22. La consola de VirtualBox sigue siendo válida para el resto del montaje."}, {"type": "verify", "text": "SRV tiene su Ubuntu, IP persistente, conectividad de descarga y acceso de administración. Continúa con el agente de SRV; no instales la base de datos ni el servidor Zabbix en esta VM."}]}, {"id": 23, "title": "SRV Instalar únicamente el agente", "blocks": [{"type": "p", "text": "SRV es el equipo observado. Aquí no instalas PostgreSQL, Apache ni zabbix-server. El agente 2 responde consultas de CPU, memoria, discos e interfaces. El servidor Zabbix y el panel continúan en MON."}, {"type": "command", "where": "SRV", "text": "cd /tmp\nrepo=https://repo.zabbix.com/zabbix/7.0/ubuntu/pool/main/z\nrepo=\"$repo/zabbix-release\"\nwget \"$repo/zabbix-release_latest_7.0+ubuntu24.04_all.deb\"\nsudo dpkg -i zabbix-release_latest_7.0+ubuntu24.04_all.deb\nsudo apt update\nsudo apt install -y zabbix-agent2", "why": "cd selecciona la carpeta temporal. repo guarda la URL del repositorio. wget descarga su paquete de registro, dpkg lo instala, apt update actualiza los índices y apt install instala solo el agente. Este repositorio es propio del Ubuntu de SRV; registrarlo antes en MON no lo registró aquí.", "result": "SRV tiene zabbix-agent2 instalado sin errores."}, {"type": "command", "where": "SRV", "text": "sudo cp /etc/zabbix/zabbix_agent2.conf /etc/zabbix/zabbix_agent2.conf.a1\nsudo nano /etc/zabbix/zabbix_agent2.conf", "why": "cp conserva un respaldo y nano abre la configuración del agente de SRV, diferente del archivo zabbix_server.conf de MON.", "result": "se abre el archivo del agente en la sesión aprendiz@srv-e01."}, {"type": "p", "text": "Deja una sola definición activa para cada parámetro siguiente y guarda el archivo. Los valores se escriben dentro de nano, no como comandos de la terminal."}, {"type": "code", "text": "Server=192.168.56.10\nHostname=SRV-E01"}, {"type": "p", "text": "Server autoriza a MON a iniciar consultas pasivas. No lleva la IP de SRV. Hostname identifica al agente; usarás el mismo nombre técnico al crear el host en el panel. Para esta ruta no uses la plantilla de agente activo ni cambies ServerActive como intento de corregir una consulta pasiva."}, {"type": "verify", "text": "el archivo contiene la dirección de MON y el nombre SRV-E01. Has configurado una autorización, no has creado todavía el host del panel."}]}, {"id": 24, "title": "SRV Activar el agente y comprobar desde MON", "blocks": [{"type": "command", "where": "SRV", "text": "sudo systemctl restart zabbix-agent2\nsudo systemctl enable zabbix-agent2\nsystemctl is-active zabbix-agent2\nsudo ss -lntp | grep 10050", "why": "restart aplica la configuración, enable habilita el arranque e is-active consulta el estado. ss -lntp lista puertos TCP en escucha y procesos; grep 10050 filtra el puerto del agente.", "result": "el servicio está active y escucha en una dirección que MON puede alcanzar por TCP 10050, no solamente en un destino inaccesible."}, {"type": "command", "where": "SRV", "text": "sudo ufw status", "why": "consulta el cortafuegos local del servidor observado.", "result": "si está inactive no agregues reglas; si está active utiliza las reglas indicadas a continuación."}, {"type": "code", "text": "sudo ufw allow from 192.168.56.10 to any port 10050 proto tcp\nsudo ufw allow from 192.168.56.1 to any port 22 proto tcp"}, {"type": "p", "text": "Esas dos órdenes se ejecutan en SRV solo con UFW activo: permiten agente desde MON y SSH desde Windows. No habilitan SNMP en SRV y no autorizan cualquier origen."}, {"type": "command", "where": "MON", "text": "ping -c 4 192.168.56.20\nzabbix_get -s 192.168.56.20 -k agent.ping\nzabbix_get -s 192.168.56.20 -k system.hostname", "why": "ping -c 4 envía cuatro solicitudes ICMP. zabbix_get hace una consulta real del agente desde quien monitorea. agent.ping prueba respuesta del programa y system.hostname devuelve la identidad del sistema observado.", "result": "SRV responde a ICMP, agent.ping devuelve 1 y el hostname corresponde a srv-e01."}, {"type": "p", "text": "Si ping funciona pero el agente no, la red puede estar operativa mientras fallan el programa, la autorización Server o el puerto. No instales otra vez Ubuntu por ese síntoma; consulta el registro del agente en la sección de diagnóstico."}, {"type": "verify", "text": "la consulta ha salido de MON y ha respondido SRV. Una prueba solo dentro de SRV no comprueba permiso de acceso remoto."}]}, {"id": 25, "title": "SRV Registrar el host en Zabbix", "blocks": [{"type": "p", "text": "Un host de Zabbix es la representación de un equipo en la plataforma. Crear la VM o instalar su agente no lo incorpora automáticamente a este recorrido: debes registrar dirección, grupo y plantilla."}, {"type": "h", "text": "Crear el host desde el navegador de Windows físico"}, {"type": "p", "text": "Abre el panel de MON con tu cuenta administradora. En Data collection → Hosts pulsa Create host. Completa estos campos y guarda con Add."}, {"type": "table", "heads": ["Campo", "Valor y significado"], "rows": [["Host name", "SRV-E01; nombre técnico del equipo en Zabbix."], ["Host groups", "LAB3399813-E01; grupo que reúne equipos del laboratorio."], ["Templates", "Linux by Zabbix agent; conjunto de ítems pasivos para Linux."], ["Interfaces", "Agent; IP 192.168.56.20; Connect to IP; puerto 10050."], ["Monitored by", "Server; consulta directamente el servidor de MON."], ["Enabled", "Marcado para permitir recolección."]]}, {"type": "p", "text": "Una plantilla es un conjunto reutilizable de ítems y reglas. La variante Linux by Zabbix agent active necesita otra dirección de comunicación y no corresponde a lo configurado. No sustituyas la interfaz de SRV por 127.0.0.1: desde MON esa dirección vuelve al propio MON."}, {"type": "h", "text": "Comprobar los datos recientes"}, {"type": "p", "text": "En Monitoring → Latest data filtra SRV-E01 y pulsa Apply. Busca CPU utilization, memory y filesystem. Revisa valor, unidad y fecha del último registro. El descubrimiento de la plantilla encuentra discos e interfaces; si todavía no aparecen, revisa Discovery rules y sus errores antes de concluir que no existen."}, {"type": "h", "text": "Punto de comprobación del segundo servidor"}, {"type": "p", "text": "Guarda una captura de dos métricas de SRV con su unidad y marca temporal. Comprueba que el último registro avanza. Debes poder señalar en qué VM está el agente, qué IP usa MON para consultarlo y dónde guarda los datos la plataforma."}, {"type": "verify", "text": "MON y SRV están completamente instalados y se comunican mediante el agente. La siguiente fase incorpora el router y el switch físicos."}]}, {"id": 26, "title": "Conectar los equipos físicos y planear sus direcciones", "blocks": [{"type": "p", "text": "Usarás R1 como router y SW1 como switch. La combinación principal es un MikroTik con RouterOS y un Catalyst con IOS o IOS XE. Más adelante se describe la alternativa de router Cisco y switch MikroTik SwOS. Elige una ruta por equipo según el sistema real; no ejecutes todos los bloques sobre el mismo dispositivo."}, {"type": "table", "heads": ["Función", "Dirección", "Conexión"], "rows": [["R1", "192.168.57.1/24", "Puerto LAN al switch."], ["SW1", "192.168.57.2/24", "IP de gestión del switch."], ["MON adaptador 3", "192.168.57.10/24", "Puente de VirtualBox hacia Ethernet físico."], ["Windows Ethernet físico", "192.168.57.30/24", "Cable Ethernet al switch."]]}, {"type": "code", "text": "Windows Ethernet ── SW1 ── puerto LAN de R1\n        │\n  Puente VirtualBox\n        │\n MON adaptador 3"}, {"type": "p", "text": "Ethernet transporta los datos de monitoreo. El cable de consola, si lo usas, sirve para configurar Cisco y es un enlace adicional. Conecta el PC a un puerto de acceso de SW1 y R1 a otro puerto de la misma VLAN de laboratorio. No conectes este montaje a la red institucional."}, {"type": "h", "text": "Evitar IP duplicadas si compartes dispositivos"}, {"type": "p", "text": "Los ejemplos suponen un conjunto físico aislado por equipo de trabajo. Si varios PC comparten R1 y SW1, acuerden una lista de direcciones: por ejemplo MON de un grupo .57.11 y del otro .57.12; Windows .57.31 y .57.32. R1 y SW1 mantienen sus IP. Sustituye también el origen permitido de ACL o comunidad SNMP; no conectes varios MON con .57.10 a un mismo segmento."}, {"type": "h", "text": "Registrar el estado inicial"}, {"type": "p", "text": "Identifica marca, modelo, versión, puertos, credenciales de acceso y configuraciones existentes. Si no conoces la credencial, utiliza el procedimiento de acceso autorizado del equipo; no adivines claves ni lo restablezcas. Guarda respaldo antes de modificar direcciones o puertos. Un switch sin gestión puede transportar tráfico, pero no genera métricas SNMP propias."}, {"type": "verify", "text": "puedes señalar el cable del PC, el cable de R1, los puertos de SW1 y las direcciones libres que utilizarás."}]}, {"id": 27, "title": "MON Agregar conexión al laboratorio físico", "blocks": [{"type": "h", "text": "Agregar la tercera tarjeta solo en MON"}, {"type": "command", "where": "MON", "text": "sudo poweroff", "why": "solicita un apagado ordenado de Ubuntu; no equivale a cerrar a la fuerza la ventana de VirtualBox.", "result": "MON queda apagado y puedes modificar su hardware virtual. Enciéndelo de nuevo después del siguiente ajuste."}, {"type": "p", "text": "En VirtualBox selecciona MON-E01 → Configuración → Red → Adaptador 3. Habilita la tarjeta, elige Adaptador puente y selecciona la tarjeta Ethernet física conectada al switch. Marca Cable conectado. Conserva Adaptador 1 NAT y Adaptador 2 solo anfitrión. SRV no requiere una tercera tarjeta en este diseño."}, {"type": "p", "text": "Arranca MON y abre su consola. Identifica el nombre y MAC de la nueva interfaz. Suele ser enp0s9, pero debe coincidir con el adaptador 3, no con NAT o solo anfitrión."}, {"type": "command", "where": "MON", "text": "ip -br link\nsudo nano /etc/netplan/50-cloud-init.yaml", "why": "ip -br link muestra nombres y MAC para identificar la nueva tarjeta. nano abre el mismo archivo de red usado antes; sustituye el nombre del archivo si el tuyo es diferente.", "result": "puedes añadir el bloque de la tarjeta nueva sin borrar las definiciones anteriores."}, {"type": "p", "text": "Añade este bloque dentro de ethernets, al mismo nivel de enp0s3 y enp0s8. No lo pegues como archivo independiente. Cambia enp0s9 si la tarjeta real tiene otro nombre."}, {"type": "code", "text": "    enp0s9:\n      dhcp4: false\n      addresses:\n        - 192.168.57.10/24"}, {"type": "p", "text": "No añadas gateway a esta interfaz: R1 y SW1 están en la misma subred. La salida a Internet continúa por NAT; poner otro gateway puede enviar las descargas por una ruta equivocada."}, {"type": "command", "where": "MON", "text": "sudo netplan generate\nsudo netplan try\nip -br address\nip route", "why": "generate revisa el YAML; try aplica temporalmente la red y pide confirmación; las dos consultas ip permiten revisar direcciones y rutas resultantes.", "result": "MON conserva .56.10 y tiene .57.10 en su tarjeta puente, con la ruta por defecto de NAT. Confirma la prueba desde la consola de la VM."}]}, {"id": 28, "title": "Windows físico Configurar acceso de gestión", "blocks": [{"type": "p", "text": "Este cambio se hace en la tarjeta Ethernet física conectada al switch. No cambies el Wi-Fi que provee Internet ni el adaptador solo anfitrión .56.1."}, {"type": "h", "text": "Asignar la dirección de esta red aislada"}, {"type": "p", "text": "1. En Windows físico pulsa Win+R, escribe ncpa.cpl y confirma. Se abre la lista de adaptadores de red. Identifica Ethernet por su nombre y enlace; puedes verificarlo desconectando y volviendo a conectar solo su cable de laboratorio."}, {"type": "p", "text": "2. Antes de cambiarlo, registra si tenía DHCP o una dirección fija, máscara, gateway y DNS. Abre Propiedades → Protocolo de Internet versión 4 → Propiedades."}, {"type": "p", "text": "3. Selecciona usar dirección IP e introduce 192.168.57.30 y máscara 255.255.255.0. Deja puerta de enlace y DNS vacíos en este adaptador aislado. Acepta. /24 en Ubuntu representa esa misma máscara."}, {"type": "command", "where": "PowerShell del Windows físico", "text": "ipconfig\nping 192.168.57.10", "why": "ipconfig muestra las direcciones de Windows. ping comprueba respuesta del MON por la tarjeta puente, no por su red solo anfitrión.", "result": "Ethernet tiene .57.30 y MON responde en .57.10. Si no responde, revisa el puente y el enlace del switch."}, {"type": "h", "text": "Acceso a un dispositivo que aún tiene otra dirección"}, {"type": "p", "text": "Cisco se puede preparar por consola sin conocer su IP. Para MikroTik RouterOS puedes usar WinBox por MAC si el equipo permite ese método. Si accedes a SwOS por una IP de otra subred, consulta la etiqueta o manual y asigna temporalmente a Windows una IP libre de esa subred para entrar. Tras cambiar el switch a .57.2, vuelve a configurar Windows en .57.30."}, {"type": "p", "text": "No supongas que todos los MikroTik tienen una IP o clave predeterminada. Los modelos recientes pueden tener credenciales indicadas en su etiqueta. Conserva tu configuración original de Windows para restituirla al finalizar el laboratorio."}, {"type": "verify", "text": "Windows llega a MON en la red física y puedes pasar a configurar SW1. Que el puente figure en VirtualBox no prueba por sí solo que el cable y el puerto funcionen."}]}, {"id": 29, "title": "SW1 Cisco Abrir consola y reconocer puertos", "blocks": [{"type": "p", "text": "Utiliza esta ruta únicamente si el Catalyst ejecuta Cisco IOS o IOS XE compatible. Catalyst es una familia, no una versión de comandos. Si es una familia con CLI diferente, como Catalyst 1200, identifica su manual y no pegues comandos incompatibles."}, {"type": "h", "text": "Abrir una terminal de consola desde Windows físico"}, {"type": "p", "text": "1. Conecta el cable de consola al puerto Console del switch y al PC. Si utiliza un convertidor USB, instala su controlador desde el fabricante del cable cuando Windows lo requiera. Abre Administrador de dispositivos → Puertos y registra el número COM que aparece."}, {"type": "p", "text": "2. Descarga PuTTY para Windows desde la fuente oficial indicada al final de la guía. Ejecuta PuTTY. Elige Serial y escribe el COM real. Muchos Catalyst usan 9600 baudios, 8 bits, sin paridad, 1 bit de parada y sin control de flujo; comprueba los parámetros del modelo antes de abrir. Una pantalla ilegible suele indicar velocidad incorrecta."}, {"type": "p", "text": "3. Pulsa Open y Enter. Inicia sesión con las credenciales existentes. En un equipo nuevo que ofrezca el diálogo de configuración automática puedes elegir no utilizarlo para realizar la configuración manual descrita aquí."}, {"type": "command", "where": "consola Cisco de SW1", "text": "enable\nshow version\nshow ip interface brief\nshow interfaces status", "why": "enable pasa al modo privilegiado, que puede pedir su clave. show version identifica plataforma y software. show ip interface brief resume interfaces IP. show interfaces status permite reconocer puertos y su enlace en modelos que lo soportan.", "result": "identificas el modelo, versión y nombres reales de los puertos conectados al PC y a R1."}, {"type": "h", "text": "Guardar el estado inicial"}, {"type": "p", "text": "Consulta show running-config y conserva una copia privada de la configuración antes de editar. Esa salida puede contener datos de acceso; no la publiques íntegra. Si no tienes autorización para modificar el dispositivo, conserva el diagnóstico y utiliza una estación de laboratorio disponible."}, {"type": "verify", "text": "has identificado dos puertos reales. Los ejemplos posteriores usan GigabitEthernet1/0/1 y 1/0/2; reemplázalos si tu modelo usa nombres como FastEthernet0/1."}]}, {"id": 30, "title": "SW1 Cisco Configurar gestión y SNMP", "blocks": [{"type": "p", "text": "La IP del switch pertenece a una interfaz lógica de gestión o SVI. No se asigna a cada puerto de acceso en este ejemplo. La SVI de VLAN 1 necesita que esa VLAN tenga al menos un puerto operativo."}, {"type": "command", "where": "SW1 con Cisco IOS o IOS XE compatible", "text": "configure terminal\nhostname SW1-E01\ninterface GigabitEthernet1/0/1\n switchport mode access\n switchport access vlan 1\n no shutdown\n exit\ninterface GigabitEthernet1/0/2\n switchport mode access\n switchport access vlan 1\n no shutdown\n exit\ninterface vlan 1\n ip address 192.168.57.2 255.255.255.0\n no shutdown\nend", "why": "configure terminal abre edición; hostname fija el nombre. interface selecciona un puerto real; switchport mode access lo configura como acceso y access vlan 1 lo asocia a VLAN 1. no shutdown lo habilita. exit vuelve al nivel anterior. interface vlan 1 selecciona la SVI e ip address le asigna su IP. end regresa al modo privilegiado.", "result": "los puertos al PC y a R1 están habilitados en la misma VLAN y la IP de gestión es .57.2/24. Sustituye nombres de puertos antes de ejecutar."}, {"type": "command", "where": "SW1", "text": "configure terminal\nip access-list standard MON_SNMP_A1\n permit host 192.168.57.10\n exit\nsnmp-server community LAB3399813 RO MON_SNMP_A1\nend\nshow ip interface brief", "why": "la ACL MON_SNMP_A1 permite como origen a MON; verifica que ese nombre no exista con otra finalidad. snmp-server community crea la comunidad de consulta y RO limita a lectura. La ACL restringe quién puede usarla. show consulta el estado final.", "result": "la SVI está activa y la comunidad permite consultas de MON, sin permiso de escritura."}, {"type": "p", "text": "SNMPv2c transmite la comunidad sin cifrar. Se utiliza aquí dentro de una red aislada para estudiar la consulta; no reutilices la comunidad de ejemplo en una red real. En producción se diseña acceso con SNMPv3 y controles acordes al entorno."}, {"type": "verify", "text": "desde MON, ping -c 4 192.168.57.2 obtiene respuesta. Si la SVI está down, comprueba VLAN, enlace y puertos antes de cambiar Zabbix."}]}, {"id": 31, "title": "R1 MikroTik Acceder y configurar su dirección", "blocks": [{"type": "p", "text": "Esta es la ruta principal para el router físico con RouterOS. No utilices comandos Cisco. Si tu R1 es Cisco, utiliza la sección «Alternativa de router Cisco y switch SwOS». Si el MikroTik ejecuta SwOS, es un switch con otra interfaz de administración y debe seguir su alternativa web."}, {"type": "h", "text": "Abrir WinBox en Windows físico"}, {"type": "p", "text": "Descarga WinBox desde https://mikrotik.com/download y ejecútalo. Conecta un puerto LAN de R1 al switch. En Neighbors identifica su MAC y abre el acceso con las credenciales del dispositivo. Si el descubrimiento MAC no está disponible, utiliza su acceso IP o consola documentado. Abre New Terminal una vez autenticado."}, {"type": "command", "where": "terminal MikroTik RouterOS", "text": "/system resource print\n/interface print\n/interface bridge port print\n/ip address print\n/system backup save name=antes-a1", "why": "resource print identifica versión y recursos; interface print enumera interfaces; bridge port print muestra puertos dentro de puentes; address print enumera las IP. backup save guarda el estado inicial en un archivo que contiene datos sensibles.", "result": "reconoces el puerto LAN conectado al switch y si pertenece a un bridge. Conserva el respaldo de forma privada."}, {"type": "h", "text": "Elegir dónde poner la dirección"}, {"type": "p", "text": "Un bridge une puertos en el mismo dominio de capa 2. Si el puerto LAN pertenece a un bridge, asigna la IP al bridge. Si es un puerto independiente, usa su nombre real. No elimines la configuración del bridge, no cambies el puerto WAN y no crees DHCP para completar este laboratorio."}, {"type": "command", "where": "RouterOS solo si el bridge real se llama bridge", "text": "/ip address add address=192.168.57.1/24 interface=bridge comment=LAB-A1\n/system identity set name=R1-E01", "why": "address add incorpora una dirección a la interfaz elegida; comment la identifica como parte de la práctica. identity set fija el nombre visible del router. Si la IP ya existe no la agregues de nuevo.", "result": "R1 tiene .57.1/24 en el bridge LAN. Si el puerto es independiente, sustituye bridge por ese puerto, por ejemplo ether2."}, {"type": "verify", "text": "desde MON responde ping -c 4 192.168.57.1. Si falla, revisa primero la interfaz elegida y el enlace al switch."}]}, {"id": 32, "title": "R1 MikroTik Habilitar SNMP y revisar permisos", "blocks": [{"type": "command", "where": "terminal RouterOS", "text": "/snmp community print\n/snmp community add name=LAB3399813 addresses=192.168.57.10/32 write-access=no\n/snmp set enabled=yes contact=EquipoE01 location=Aula3399813", "why": "print revisa comunidades existentes. add crea una comunidad una sola vez, limitada a la dirección de MON; /32 representa un único host. write-access=no impide escritura y el valor predeterminado de lectura es yes. snmp set habilita el servicio y añade identificación administrativa.", "result": "la comunidad del laboratorio permite lectura a MON y el servicio SNMP está habilitado."}, {"type": "p", "text": "En WinBox → SNMP → Communities comprueba read-access=yes, write-access=no y origen 192.168.57.10/32. Si ya existía LAB3399813, edita esa entrada en lugar de duplicarla. Revisa también la comunidad public: si no tiene un uso autorizado, restringe su origen o desactiva su lectura para evitar acceso más amplio que el previsto."}, {"type": "h", "text": "Si una regla del firewall descarta la consulta"}, {"type": "p", "text": "Abre IP → Firewall → Filter Rules. Examina las reglas de input, que controlan tráfico destinado al propio router. Si una regla de descarte bloquea SNMP, añade antes de ella una regla específica: chain input, protocolo UDP, src address 192.168.57.10, dst port 161 y action accept. No elimines reglas anteriores ni desactives el firewall. Si la entrada LAN ya está permitida, esa regla adicional puede no ser necesaria."}, {"type": "command", "where": "RouterOS", "text": "/snmp print\n/ip firewall filter print stats", "why": "la primera orden consulta si el servicio está habilitado. La segunda muestra reglas y contadores que ayudan a identificar una coincidencia de tráfico; no modifica la configuración.", "result": "compruebas estado y, si falla la consulta, puedes relacionar el intento de MON con la regla aplicada."}, {"type": "verify", "text": "R1 está listo para snmpget desde MON. La comunidad y el servicio en sí mismos no prueban que el firewall permita el tráfico."}]}, {"id": 33, "title": "Alternativa de router Cisco y switch SwOS", "blocks": [{"type": "h", "text": "R1 cuando el router ejecuta Cisco IOS"}, {"type": "p", "text": "Abre su consola desde Windows físico con el COM y parámetros documentados del router. Accede con sus credenciales y usa enable, show version y show ip interface brief para identificar software y puerto conectado a SW1. Guarda una copia privada de su configuración antes de cambiarla."}, {"type": "command", "where": "R1 con Cisco IOS compatible y puerto real sustituido", "text": "configure terminal\nhostname R1-E01\ninterface GigabitEthernet0/0\n ip address 192.168.57.1 255.255.255.0\n no shutdown\n exit\nip access-list standard MON_SNMP_A1\n permit host 192.168.57.10\n exit\nsnmp-server community LAB3399813 RO MON_SNMP_A1\nend", "why": "se entra a configuración, se identifica el router, se selecciona su puerto hacia SW1 y se asigna la IP. La ACL limita el origen de las consultas SNMP y RO habilita solo lectura. No utilices un puerto del router que ya tenga otra función.", "result": "R1 responde por .57.1 y permite SNMP de MON. Si la interfaz se llama de otra manera, reemplaza GigabitEthernet0/0 antes de ejecutar."}, {"type": "h", "text": "SW1 cuando el switch MikroTik ejecuta SwOS"}, {"type": "p", "text": "Accede desde el navegador de Windows físico a la IP de gestión actual del switch, con sus credenciales. Si pertenece a otra subred, asigna temporalmente una IP libre de esa subred al Ethernet de Windows para acceder. En System revisa el modelo, versión y dirección; configura IP fija 192.168.57.2/24 en la red aislada y vuelve a poner Windows en .57.30."}, {"type": "p", "text": "En la pestaña SNMP marca Enabled, introduce Community LAB3399813 y completa Contact Info y Location; aplica cambios. SwOS no utiliza la terminal RouterOS. Consulta en su manual qué versiones SNMP admite y qué restricciones de origen están disponibles. No supongas que Allow From de acceso web restringe también SNMP."}, {"type": "p", "text": "Desde MON consulta sysName a .57.2 con snmpget como se indica en la próxima sección. Si el modelo solo admite v1, usa -v1 en la consulta y configura también v1 en Zabbix; registra la adaptación. No cambies de versión para ocultar un error de comunidad."}, {"type": "verify", "text": "cada dispositivo utiliza la ruta de su propio sistema operativo y responde con su dirección de gestión asignada."}]}, {"id": 34, "title": "MON Comprobar la consulta física antes del panel", "blocks": [{"type": "command", "where": "MON", "text": "ip route get 192.168.57.2\nping -c 4 192.168.57.1\nping -c 4 192.168.57.2", "why": "ip route get consulta la ruta que usaría Linux hacia SW1. Debe seleccionar la tarjeta puente y el origen .57.10. ping comprueba respuesta ICMP del router y switch por separado.", "result": "el origen es el permitido por las ACL o comunidades, y ambos destinos responden. Si compartes equipos, usa tu dirección acordada en lugar de .10."}, {"type": "command", "where": "MON", "text": "snmpget -v2c -c LAB3399813 192.168.57.1 .1.3.6.1.2.1.1.5.0\nsnmpget -v2c -c LAB3399813 192.168.57.2 .1.3.6.1.2.1.1.5.0\nsnmpget -v2c -c LAB3399813 192.168.57.2 .1.3.6.1.2.1.1.3.0", "why": "snmpget consulta un objeto concreto. -v2c selecciona versión; -c indica la comunidad; sigue la IP destino y después el OID. .1.3.6.1.2.1.1.5.0 es sysName y .1.3.6.1.2.1.1.3.0 es sysUpTime.", "result": "cada sysName identifica el dispositivo correcto y sysUpTime devuelve un valor temporal. Ese valor representa la actividad de la parte de gestión SNMP, no necesariamente el arranque completo del equipo."}, {"type": "command", "where": "MON", "text": "snmpwalk -v2c -c LAB3399813 192.168.57.2 .1.3.6.1.2.1.2.2.1.2", "why": "snmpwalk recorre los objetos de una rama, en vez de pedir solo uno. Este OID enumera descripciones de interfaces e índices; los números finales vinculan cada contador con un puerto.", "result": "puedes relacionar un índice con el puerto conectado al PC. No supongas que siempre será el índice 2."}, {"type": "p", "text": "Un OID es una dirección jerárquica de un objeto de gestión. La MIB describe qué significa cada objeto y sus tipos. Los OID numéricos permiten hacer estas consultas sin depender de nombres de MIB instalados en MON. Si aparece Timeout, revisa IP, versión, comunidad, origen permitido y reglas antes de configurar Zabbix."}, {"type": "verify", "text": "guardaste respuestas propias de R1 y SW1 y el índice real de un puerto de SW1. Una comunidad correcta escrita en un archivo no sustituye esa prueba."}]}, {"id": 35, "title": "Registrar R1 y SW1 en Zabbix", "blocks": [{"type": "p", "text": "En el navegador de Windows físico abre el panel de MON. Data collection → Hosts → Create host. Crea primero R1-E01 y después SW1-E01 como objetos separados; no cambies la IP de SRV para representar otro equipo."}, {"type": "table", "heads": ["Campo", "R1-E01", "SW1-E01"], "rows": [["Host groups", "LAB3399813-E01", "LAB3399813-E01"], ["Interface", "SNMP", "SNMP"], ["IP", "192.168.57.1", "192.168.57.2"], ["Port", "161", "161"], ["SNMP version", "SNMPv2", "SNMPv2"], ["SNMP community", "LAB3399813", "LAB3399813"], ["Monitored by", "Server", "Server"], ["Enabled", "Habilitado", "Habilitado"]]}, {"type": "p", "text": "En esta ruta crearás ítems manuales para entender exactamente qué se consulta. No necesitas vincular una plantilla genérica al azar. Si más adelante utilizas una plantilla compatible con el modelo, comprueba sus requisitos y evita duplicar claves ya existentes."}, {"type": "h", "text": "Crear el primer ítem de cada host"}, {"type": "p", "text": "Abre Items de R1-E01 → Create item. Name LAB SNMP nombre; Type SNMP agent; Key lab.snmp.nombre; Host interface SNMP de R1; SNMP OID .1.3.6.1.2.1.1.5.0; Type of information Character; Update interval 60s; History 7d; Units vacío. Guarda. Después crea ese mismo ítem en SW1-E01, seleccionando su interfaz."}, {"type": "p", "text": "Name es la etiqueta visible. Key es un identificador único dentro del host; aquí puede repetirse en otro host. SNMP OID identifica lo consultado al dispositivo. Character conserva texto, por eso es adecuado para el nombre del equipo. 60s es el intervalo de recolección del software y 7d la retención de sus registros."}, {"type": "verify", "text": "Latest data muestra el nombre actual de cada equipo físico en su host correspondiente. Compara con las consultas directas de snmpget."}]}, {"id": 36, "title": "Interpretar y configurar un dato SNMP temporal", "blocks": [{"type": "p", "text": "Crea otro ítem en R1-E01 y en SW1-E01, con la misma estructura siguiente. Debe pertenecer a la interfaz SNMP del dispositivo que estás configurando."}, {"type": "table", "heads": ["Campo", "Valor", "Por qué se usa"], "rows": [["Name", "LAB SNMP tiempo", "Nombre legible de la lectura."], ["Type", "SNMP agent", "Consulta usando SNMP."], ["Key", "lab.snmp.tiempo", "Identifica el ítem dentro del host."], ["SNMP OID", ".1.3.6.1.2.1.1.3.0", "Objeto sysUpTime."], ["Type of information", "Numeric float", "Admite un valor con decimales tras convertirlo."], ["Update interval", "60s", "Parámetro de consulta periódica."], ["History", "7d", "Retención de registros."], ["Units", "s", "Representa segundos."], ["Preprocessing", "Custom multiplier 0.01", "Convierte centésimas de segundo a segundos."]]}, {
